<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#0f1729" />
    <title>SnowOps Labs</title>
    <script>
      // Stamp the theme before first paint so there is no flash. Mirrors
      // src/lib/theme.ts (kept inline and tiny; it must run without the bundle).
      (function () {
        try {
          var t = localStorage.getItem('snowops-theme') || 'system';
          var dark = t === 'dark' || (t === 'system' &&
            !(window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches));
          document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
