# goreleaser configuration for the labctl CLI.
#
# labctl is a single self-contained binary with the web UI embedded, and is
# cgo-free (ADR-0002), so cross-compilation is a plain GOOS/GOARCH matrix. A
# tagged release (vX.Y.Z) builds the four supported targets, archives them with
# a checksums file, and opens a GitHub Release as a DRAFT for the maintainer to
# review and publish. See RELEASING.md.
version: 2

project_name: labctl

# The UI must be built and embedded before any target compiles. These hooks run
# once, before the build matrix.
before:
  hooks:
    - make ui-build
    - bash -c 'mkdir -p internal/webui/dist && cp -R ui/dist/. internal/webui/dist/'
    - bash -c 'cp ../README.md ../LICENSE ../NOTICE .'

builds:
  - id: labctl
    main: ./cmd/labctl
    binary: labctl
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    mod_timestamp: '{{ .CommitTimestamp }}'

archives:
  - id: labctl
    formats:
      - tar.gz
    name_template: "labctl_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    # Staged into src/ by the `before` hook above (goreleaser v2 can't glob a
    # `..` path). Referenced by plain name so they land at the archive root.
    files:
      - README.md
      - LICENSE
      - NOTICE

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot"

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^ci:'
      - '^chore:'

release:
  # owner/name are auto-detected from the git remote (the repo rename is a
  # maintainer open item). The release opens as a draft so it is reviewed
  # before going public.
  draft: true
  prerelease: auto
  name_template: "labctl {{ .Version }}"
