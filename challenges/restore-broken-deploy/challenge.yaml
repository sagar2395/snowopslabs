name: restore-broken-deploy
displayName: "Restore the broken deploy"
description: >
  go-api has been deployed with a nonexistent image tag — pods are stuck
  in ImagePullBackOff. Your job: identify the problem, update the
  deployment to a valid image, and get the rollout healthy before the
  clock runs out.
category: workload
parTime: "10m"
setup:
  type: incident
  ref: bad-deploy-rollout
grading:
  useDetectionCheck: true
hintPenalty: 5
