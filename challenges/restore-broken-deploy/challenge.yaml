name: restore-broken-deploy
displayName: "Restore the broken deploy"
description: >
  A release went out an hour ago and never finished. Users are still being
  served by the old version, the rollout has not advanced, and the deploy
  pipeline is red. Get the rollout healthy before the clock runs out.
category: workload
parTime: "6m"
setup:
  type: incident
  ref: bad-deploy-rollout
grading:
  useDetectionCheck: true
hintPenalty: 5
