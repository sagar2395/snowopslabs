name: License scan

# Fails the build if a copyleft (GPL/AGPL/LGPL...) dependency enters the
# Apache-2.0 core, protecting against accidental license "infection".

on:
  push:
    branches: [main]
    paths:
      - 'src/cmd/**'
      - 'src/pkg/**'
      - '**/go.mod'
      - '**/go.sum'
      - '.github/workflows/license-scan.yml'
  # No path filter here: the "Go dependency licenses" job is a REQUIRED status
  # check in the protect-main ruleset, and a required check must run on every PR.
  # If it were path-filtered, a PR that touches no Go files would skip this
  # workflow, the required context would never report, and the ruleset's strict
  # policy would block the PR indefinitely.
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  go-deps:
    name: Go dependency licenses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # The Go module lives under src/ (issue #7).
          go-version-file: src/go.mod
      - name: Install go-licenses
        run: go install github.com/google/go-licenses@latest
      - name: Check disallowed licenses
        # forbidden + restricted == GPL/AGPL/LGPL family and similar copyleft.
        # The module now lives under src/, so the repo-root LICENSE is outside
        # the module tree; --ignore skips our own first-party packages (they are
        # Apache-2.0 and are not what this scan is for — it guards dependencies).
        working-directory: src
        run: go-licenses check ./... --disallowed_types=forbidden,restricted --ignore github.com/sagar2395/snowopslabs

  spdx-headers:
    name: SPDX headers (advisory)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Warn on Go files missing an SPDX header
        run: |
          missing=0
          while IFS= read -r f; do
            if ! head -5 "$f" | grep -q 'SPDX-License-Identifier'; then
              echo "::warning file=$f::missing SPDX-License-Identifier header"
              missing=$((missing+1))
            fi
          done < <(find src/cmd src/pkg -name '*.go' 2>/dev/null)
          echo "Go files missing SPDX header: $missing (advisory; required on NEW files)"
