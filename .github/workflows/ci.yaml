# CI — the essential gates that must hold before a change merges to main.
#
# Deliberately lean to keep GitHub Actions cost low on a private repo: every job
# runs on ubuntu-latest (no macOS 10x-cost runners), and only the checks that
# protect correctness are here. Heavier/optional gates (macOS portability,
# gosec/govulncheck, fuzzing, Playwright journeys, per-PR goreleaser, license and
# helm-chart scans) were removed; re-add them selectively if the need returns.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push supersedes an in-flight run of the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GO_VERSION: '1.24'
  NODE_VERSION: '22'

jobs:
  # ── Go ─────────────────────────────────────────────────────────────────────

  go-test:
    name: Go tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # The race detector is not optional: the run engine is concurrent by
      # design (ADR-0003, ADR-0004). Includes the per-package coverage gate.
      - name: Test with race detector and coverage gate
        run: make test-go

  go-lint:
    name: Go lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: gofmt
        run: make fmt-check

      - name: go vet
        run: go vet ./...

      - name: go mod tidy is clean
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      # NOTE: golangci-lint was removed here. Its step had never actually run —
      # the repo's .golangci.yml is v2 schema but golangci-lint-action@v6 installs
      # a v1 binary, so `config verify` failed before any linting happened. Turning
      # it on cleanly surfaces ~25 pre-existing findings (errcheck/contextcheck/
      # gosec/noctx). Re-enable with golangci-lint-action@v7+ once those are fixed.

  # ── Shell ──────────────────────────────────────────────────────────────────

  shell:
    name: Shell
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install bats
        run: npm install -g bats

      - name: Shell tests
        run: make test-shell

      - name: Install shell linters
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          go install mvdan.cc/sh/v3/cmd/shfmt@latest

      - name: shellcheck, shfmt and the portability gate
        run: make lint-shell

  # ── UI ─────────────────────────────────────────────────────────────────────

  ui:
    name: UI (types, components, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - run: npm ci
        working-directory: ui

      - name: Typecheck (strict)
        run: npm run typecheck
        working-directory: ui

      - name: Component tests with coverage
        run: npm run test:coverage
        working-directory: ui

      - name: Build SPA
        run: npm run build
        working-directory: ui

  # ── Content ────────────────────────────────────────────────────────────────

  build:
    name: Build and validate content
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Build labctl (UI embedded)
        run: make cli-build

      # Schema + cross-reference integrity + template resolution over every
      # scenario, incident, learning path and challenge.
      - name: Validate content
        run: ./bin/labctl validate

  # ── Sample apps ────────────────────────────────────────────────────────────

  apps:
    name: Sample apps (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [go-api, echo-server]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: apps/${{ matrix.app }}/go.sum

      - name: Vet and test
        working-directory: apps/${{ matrix.app }}
        run: |
          go vet ./...
          go test -race ./...
