# CI — every gate that must hold before a change merges.
#
# Nothing here is advisory: each job fails the build. The four test layers are
# defined in docs/TESTING.md; the quality bar per task is the Definition of Done
# in docs/ROADMAP.md.
#
# Path filters are deliberately absent. In a repo this interconnected (Go reads
# YAML content, scripts are covered by bats, the SPA is embedded in the binary)
# path filtering produces false greens, and the suite is fast enough to run whole.
name: CI

on:
  push:
    branches: [main, 'claude/**', 'feature/**']
  pull_request:
    branches: [main]

# A new push supersedes an in-flight run of the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GO_VERSION: '1.26'
  NODE_VERSION: '22'

jobs:
  # ── Layer 1: Go ────────────────────────────────────────────────────────────

  go-test:
    name: Go tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Golden rule 1: macOS and Linux, always. A macOS-only portability
        # regression must fail here, not in a user's terminal.
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build
        working-directory: src
        run: go build ./...

      - name: Vet
        working-directory: src
        run: go vet ./...

      # The race detector is not optional: the run engine is concurrent by
      # design (ADR-0003, ADR-0004). Run from the repo root; the target
      # delegates into the src/ module (make -C src) and writes src/coverage.out.
      - name: Test with race detector and coverage gate
        run: make test-go

      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: src/coverage.out
          retention-days: 7

  go-lint:
    name: Go lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: gofmt
        run: make fmt-check

      # golangci-lint v2: the repo's .golangci.yml is v2 schema, which requires
      # action v7+/golangci-lint v2 (v6 installs a v1 binary and fails `config
      # verify`). Pinned so the linter set does not drift under the branch.
      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.13.1
          args: --timeout=5m
          working-directory: src

      - name: go mod tidy is clean
        working-directory: src
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

  go-security:
    name: Go security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # gosec (SAST) runs as part of golangci-lint (the go-lint job) so its
      # findings share the repo's .golangci.yml suppressions — running it again
      # standalone here would re-flag every justified //nolint. This job keeps
      # dependency-vulnerability scanning, which golangci-lint does not do.
      - name: govulncheck
        working-directory: src
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  fuzz:
    name: Fuzz (smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      # A short run on every PR catches crashers introduced by the change; the
      # long run happens nightly.
      - run: make fuzz FUZZTIME=10s

  # ── Layer 2: shell ─────────────────────────────────────────────────────────

  shell:
    name: Shell (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install bats
        run: npm install -g bats

      - name: Shell tests
        run: make test-shell

      - name: Install shell linters
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            brew install shellcheck shfmt
          else
            sudo apt-get update && sudo apt-get install -y shellcheck
            go install mvdan.cc/sh/v3/cmd/shfmt@latest
          fi

      - name: shellcheck, shfmt and the portability gate
        run: make lint-shell

  # ── Layer 4: UI ────────────────────────────────────────────────────────────

  ui:
    name: UI (types, components, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: src/ui/package-lock.json

      - run: npm ci
        working-directory: src/ui

      - name: Typecheck (strict)
        run: npm run typecheck
        working-directory: src/ui

      - name: Component tests with coverage
        run: npm run test:coverage
        working-directory: src/ui

      - name: Build SPA
        run: npm run build
        working-directory: src/ui

  e2e:
    name: UI journeys (playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: src/ui/package-lock.json

      - run: npm ci
        working-directory: src/ui

      - name: Install browser
        run: npx playwright install --with-deps chromium
        working-directory: src/ui

      - name: Run journeys
        run: npm run test:e2e
        working-directory: src/ui

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: src/ui/playwright-report/
          retention-days: 7

  # ── Content and packaging ──────────────────────────────────────────────────

  build:
    name: Build and validate content
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: src/ui/package-lock.json

      - name: Build labctl (UI embedded)
        run: make cli-build

      # Schema + cross-reference integrity + template resolution over every
      # scenario, incident, learning path and challenge. Fails the build on any
      # problem, naming the file, line and reference (W2-T07). The binary is
      # built under src/bin/ but discovers content from the repo root (CWD).
      - name: Validate content
        run: ./src/bin/labctl validate

      - name: Cross-compile every release target
        run: make cli-build-all

  release-config:
    name: Release config (goreleaser)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: src/ui/package-lock.json

      # Validate .goreleaser.yaml and prove the full release build path (UI
      # build + embed + cross-compile) works, without publishing anything, so a
      # broken release config fails a PR rather than a tag. The config lives in
      # src/ alongside go.mod, so goreleaser runs from there.
      - name: Install goreleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          install-only: true
      - name: goreleaser check
        working-directory: src
        run: goreleaser check
      - name: goreleaser snapshot build (host target)
        working-directory: src
        run: goreleaser build --snapshot --clean --single-target

  apps:
    name: Sample apps (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [go-api, echo-server]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: apps/${{ matrix.app }}/go.sum

      - name: Vet and test
        working-directory: apps/${{ matrix.app }}
        run: |
          go vet ./...
          go test -race ./...
