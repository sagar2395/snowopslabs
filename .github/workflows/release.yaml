# Release — cut cross-platform labctl binaries for a version tag.
#
# Runs when a vX.Y.Z tag is pushed, and when the Tag release workflow calls it
# with the tag it created (a workflow's own tag push starts no workflow).
# goreleaser builds the four supported targets (darwin/linux × amd64/arm64),
# archives them with a checksums file, and opens a GitHub Release as a DRAFT
# for the maintainer to review and publish. See RELEASING.md and
# .goreleaser.yaml.
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_call:
    inputs:
      tag:
        description: the vX.Y.Z tag to release
        required: true
        type: string

permissions:
  contents: write # create the GitHub Release and upload artifacts

env:
  GO_VERSION: '1.26'
  TAG: ${{ inputs.tag || github.ref_name }}
  NODE_VERSION: '22'

jobs:
  release:
    name: goreleaser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.TAG }}
          fetch-depth: 0 # goreleaser needs full history + tags for the changelog

      # A clone reads its release from LAB_VERSION, and install.sh installs the
      # labctl of that version, so the tag and the file must agree.
      - name: LAB_VERSION matches the tag
        run: |
          want="${TAG#v}"
          got="$(tr -d '[:space:]' < LAB_VERSION)"
          if [ "$got" != "$want" ]; then
            echo "LAB_VERSION is '$got' but the tag is $TAG; set LAB_VERSION to $want, commit, and tag that commit." >&2
            exit 1
          fi

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: src/ui/package-lock.json

      # The module and .goreleaser.yaml live under src/ (issue #7); run
      # goreleaser from there. workdir keeps it building where go.mod is.
      - name: Run goreleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
          workdir: src
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ env.TAG }}
