# Release — cut cross-platform labctl binaries on a version tag.
#
# Triggered by pushing a semver tag (vX.Y.Z). goreleaser builds the four
# supported targets (darwin/linux × amd64/arm64), archives them with a
# checksums file, and opens a GitHub Release as a DRAFT for the maintainer to
# review and publish. See RELEASING.md and .goreleaser.yaml.
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # create the GitHub Release and upload artifacts

env:
  GO_VERSION: '1.24'
  NODE_VERSION: '22'

jobs:
  release:
    name: goreleaser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # goreleaser needs full history + tags for the changelog

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Run goreleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
