# End-to-end test on kind — the real-cluster gate (docs/TESTING.md).
#
# kind is a headless, CI-friendly runtime, so we can run a real lab lifecycle in
# GitHub Actions: create a cluster, load the app image, activate a scenario, and
# assert its checks pass via `labctl scenario verify`.
#
# Scheduled nightly + manual only (never per-PR): an e2e run is heavier and
# slower than the unit suite, and a flake should not block merges.
#
# It uses the env-promotion scenario on purpose: its checks are all kubectl-based
# (namespaces, deployment readiness, ConfigMaps) — no Prometheus or ingress
# traffic required — so the run is deterministic on a vanilla kind cluster.
name: e2e-kind

on:
  schedule:
    - cron: '17 4 * * *' # nightly at 04:17 UTC
  workflow_dispatch: {}

env:
  GO_VERSION: '1.26'
  CLUSTER_NAME: snowops
  PROFILE: kind

jobs:
  e2e:
    name: kind e2e (scenario verify)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install kind
        uses: helm/kind-action@v1
        with:
          install_only: true

      - name: Build labctl
        working-directory: src
        run: go build -o "$GITHUB_WORKSPACE/bin/labctl" ./cmd/labctl

      - name: Add bin to PATH
        run: echo "$GITHUB_WORKSPACE/bin" >> "$GITHUB_PATH"

      - name: Create kind cluster
        run: labctl runtime up

      - name: Build and load the go-api image
        run: |
          docker build -t go-api:latest apps/go-api
          kind load docker-image go-api:latest --name "$CLUSTER_NAME"

      - name: Activate scenario
        run: labctl scenario up env-promotion

      - name: Verify scenario checks pass
        run: labctl scenario verify env-promotion

      - name: Tear down scenario
        if: always()
        run: labctl scenario down env-promotion || true

      - name: Destroy kind cluster
        if: always()
        run: labctl runtime down || true
