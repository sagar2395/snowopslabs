# golangci-lint configuration.
#
# The linter set is chosen for the failure modes this codebase actually has:
# unchecked errors around cluster operations, contexts that get dropped between
# layers, leaked HTTP bodies, and error comparisons that break when a wrapped
# error is introduced.
version: "2"

run:
  timeout: 5m
  tests: true

linters:
  enable:
    - errcheck        # unchecked errors — the #1 source of silent failure here
    - govet
    - staticcheck
    - ineffassign
    - unused
    - revive          # style + error-string/return conventions
    - bodyclose       # leaked HTTP response bodies
    - errorlint       # use errors.Is/As, not == and type assertions
    - noctx           # no HTTP requests without a context
    - nilerr          # returning nil after a non-nil error
    - unconvert
    - misspell
    - gosec

  settings:
    errcheck:
      exclude-functions:
        # Deferred Close on a read-only handle is the one idiomatic exception.
        - (io.Closer).Close
        # Writing to stdout/stderr or a buffered CLI writer: a failed terminal
        # write is not actionable and checking it everywhere adds only noise.
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        - (*text/tabwriter.Writer).Flush
    revive:
      # The `exported` doc-comment rule is intentionally omitted: it flags dozens
      # of internal API symbols and is a style aspiration, not a bug gate. The
      # rules kept below are the ones that catch confusing or misused errors.
      rules:
        - name: context-as-argument
        - name: error-strings
        - name: error-return
    gosec:
      excludes:
        # G204: this tool's entire job is running shell scripts. Command
        # construction is argv-only and paths are containment-checked in
        # internal/toolchain (W1-T03), which is where that risk is handled.
        - G204
        # G301/G302/G306: this is a single-user local lab CLI. Its state,
        # results, and snapshot files under .labctl/ are deliberately
        # world-readable (0644 files, 0755 dirs) so the operator can inspect
        # them with ordinary tools; they hold no secrets.
        - G301
        - G302
        - G306
        # G304: scenario/incident content is read from repo-controlled paths the
        # engine resolves from the on-disk catalog, not from untrusted input.
        - G304

  exclusions:
    rules:
      # Tests may take shortcuts that production code may not.
      - path: _test\.go
        linters: [errcheck, gosec, noctx, revive, contextcheck]

formatters:
  enable:
    - gofmt
