# Tempo Helm Chart Values - Single Binary Mode
# Lightweight configuration for homelab use

tempo:
  storage:
    trace:
      backend: local
      local:
        path: /var/tempo/traces
      wal:
        path: /var/tempo/wal
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: "0.0.0.0:4317"
        http:
          endpoint: "0.0.0.0:4318"
    zipkin:
      endpoint: "0.0.0.0:9411"
    jaeger:
      protocols:
        thrift_http:
          endpoint: "0.0.0.0:14268"
        grpc:
          endpoint: "0.0.0.0:14250"
  # Derive RED metrics (rate, errors, duration) from spans and remote-write them
  # to Prometheus, so traces feed the same dashboards as the app's own metrics.
  # The service name follows the kube-prometheus-stack release ("prometheus").
  metricsGenerator:
    enabled: true
    remoteWriteUrl: "http://prometheus-kube-prometheus-prometheus.monitoring.svc.cluster.local:9090/api/v1/write"

persistence:
  enabled: true
  storageClassName: local-path
  size: 5Gi

# Resource limits for homelab
resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi
