# Custom values for Traefik installation
# This file is referenced by platform/ingress/traefik/install.sh via -f.

# expose dashboard via API (additional ingressRoute is disabled by default)
api:
  dashboard: true

# k3d's built-in load balancer publishes this Service on the host's 80/443.
# install.sh overrides it on kind, which has no load balancer.
service:
  spec:
    type: LoadBalancer

# If you want the dashboard ingress route as well:
# ingressRoute:
#   dashboard:
#     enabled: true
#     entryPoints:
#       - traefik
