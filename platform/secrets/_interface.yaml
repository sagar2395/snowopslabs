# Secrets Management Provider Interface
# A secrets backend (vault) plus a sync operator (external-secrets) that pulls
# from it. They form a chain — external-secrets PREREQUIRES vault — but are
# installed as separate providers (address as secrets/<provider>).
# Current implementations: vault, external-secrets

name: secrets
description: Centralised secrets management — a Vault backend and an operator that syncs secrets into Kubernetes.

provides:
  - A Vault KV store holding application secrets (vault)
  - Continuous sync of Vault secrets into native k8s Secrets (external-secrets)
  - A rotation exercise: change the value in Vault, watch it propagate

requires:
  kubernetes_resources:
    - Vault StatefulSet + Service (vault)
    - ESO controller/webhook/cert-controller Deployments + CRDs (external-secrets)
    - SecretStore + ExternalSecret CRs, and the k8s Secret they produce
  tools:
    - helm
    - kubectl

env_variables:
  SECRETS_PROVIDER: "Provider to act on for the bare `secrets` category (vault | external-secrets). Usually address secrets/<provider> explicitly."
  VAULT_DEV_ROOT_TOKEN: "Vault dev root token (from env, NEVER committed; default: root)"
  VAULT_DEMO_SECRET: "vault: demo KV value seeded at secret/go-api"
  VAULT_CHART_VERSION: "vault: pinned hashicorp/vault chart version (versions.env)"
  ESO_CHART_VERSION: "external-secrets: pinned chart version (versions.env)"
  SECRETS_NAMESPACE: "external-secrets: namespace to sync the secret into (default: go-api)"
  VAULT_NAMESPACE: "external-secrets: namespace where Vault runs (default: vault)"

scripts:
  install.sh: "Install the component (idempotent); ESO preflights for Vault"
  uninstall.sh: "Remove the component and its wiring (idempotent)"
  status.sh: "Show health + sync state via jsonpath; print a reveal/rotate hint"

values:
  values.yaml: "Helm values for the chart (k3d-minimal resources)"

conventions:
  - NO secrets in git, ever. Tokens and demo values come from the environment;
    the dev root token defaults to the well-known Vault dev value 'root'.
  - external-secrets does NOT auto-install Vault — it errors in preflight if the
    Vault service is missing, telling you to install secrets/vault first.
  - status.sh reads readiness/sync state from .status conditions via jsonpath.
  - Chart versions are pinned and overridable via env (defaults in versions.env).

implementations:
  vault:
    chart: hashicorp/vault
    mode: "dev (in-memory, auto-unsealed) — simulation only; non-dev profile sketched in values.yaml"
    seeds: "secret/go-api (key: api-key)"
    ui: "exposed via ingress at vault.<DOMAIN_SUFFIX>"
    notes: "Dev data is wiped on pod restart. Rotation is the exercise, not HA."
  external-secrets:
    chart: external-secrets/external-secrets
    backend: "Vault (token auth via SecretStore)"
    sync: "secret/go-api -> ExternalSecret go-api-secret -> k8s Secret go-api-secrets (refresh 15s)"
    notes: "Prerequisite: vault. Wire the synced Secret into go-api via envFrom."

resource_notes:
  - "Vault dev + ESO are light; they fit a laptop k3d easily alongside monitoring."
