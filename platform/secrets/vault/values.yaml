# Custom values for the HashiCorp Vault Helm chart (lab dev profile).
# Referenced by platform/secrets/vault/install.sh via -f.
#
# Dev mode (server.dev.enabled) is set on the install.sh command line along with
# the root token (from env, never committed). Dev mode is single-pod, in-memory,
# and auto-unsealed — perfect for simulation, useless for anything real.
#
# --- Non-dev profile (sketch; do NOT use as-is) ---
# To run a "real" Vault you would instead set:
#   server:
#     dev: { enabled: false }
#     ha:  { enabled: true, replicas: 3, raft: { enabled: true } }
#     dataStorage: { enabled: true, size: 2Gi }
#   And then initialise + unseal Vault (vault operator init/unseal) and store the
#   unseal keys/root token in a real secrets manager — never in git. The lab does
#   not automate this; it is left as a documented exercise.

server:
  # Keep the dev server tiny for k3d.
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi

# Enable the web UI (exposed via ingress in install.sh).
ui:
  enabled: true

# The agent injector is not needed — we sync secrets via External Secrets.
injector:
  enabled: false
