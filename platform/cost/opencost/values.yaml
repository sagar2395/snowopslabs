# Custom values for the opencost/opencost Helm chart.
# Referenced by platform/cost/opencost/install.sh via -f.
# Tuned for k3d / laptop use: small resource footprint; ingress disabled by
# default (use port-forward or enable INGRESS_PROVIDER after installing).
#
# NOTE: No cloud billing API is configured. OpenCost uses on-prem pricing
# defaults ($0.048/CPU-hour, $0.006/GB-hour) — representative for right-sizing
# exercises even without real billing data.

opencost:
  exporter:
    defaultClusterId: "lab-cluster"
    resources:
      requests:
        cpu: 10m
        memory: 55Mi
      limits:
        cpu: 100m
        memory: 128Mi

  ui:
    enabled: true
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 64Mi

    # Expose the OpenCost UI through the cluster ingress so it is reachable at
    # http://opencost.<domain> without a port-forward. NOTE: the ingress config
    # lives under opencost.ui.ingress (not opencost.ingress) — that is where the
    # chart reads it; a top-level opencost.ingress block is silently ignored.
    # install.sh overrides the host with the real DOMAIN_SUFFIX at install time.
    ingress:
      enabled: true
      ingressClassName: traefik
      hosts:
        - host: opencost.k3d.local
          paths:
            - /
