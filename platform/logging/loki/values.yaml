# Loki Helm Chart Values — single-binary mode, sized for a laptop cluster.
#
# This file is the single source of truth for Loki's configuration. Scenarios
# that need Loki reference it via `platformValues: logging/loki` and layer only
# their differences on top — a second full copy drifts, and Helm turns drift on
# a StatefulSet into an immutable-field error on upgrade.

deploymentMode: SingleBinary

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h
  # Log retention — default 7 days. Override via LOKI_RETENTION_HOURS, which
  # install.sh turns into a --set on loki.limits_config.retention_period.
  # Set it to 0 to keep logs forever (the PVC fills up eventually).
  limits_config:
    retention_period: 168h
  compactor:
    retention_enabled: true
    delete_request_store: filesystem

singleBinary:
  replicas: 1
  persistence:
    enabled: true
    storageClass: local-path
    size: 5Gi
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi

# Components not used in single-binary mode.
backend:
  replicas: 0
read:
  replicas: 0
write:
  replicas: 0

# Gateway fronts the read/write APIs; Grafana's datasource points at it.
gateway:
  enabled: true
  replicas: 1

# The memcached caches are on by default and each requests ~9.6Gi, which leaves
# the pods permanently Pending on a laptop cluster. A single-binary,
# filesystem-backed Loki does not need them.
chunksCache:
  enabled: false
resultsCache:
  enabled: false

# Loki is part of the monitoring stack, so it does not monitor itself here.
# lokiCanary moved to the top level in the newer chart — leaving it only under
# `monitoring:` silently left the canary DaemonSet running on every node.
lokiCanary:
  enabled: false

monitoring:
  selfMonitoring:
    enabled: false
    grafanaAgent:
      installOperator: false

test:
  enabled: false
