# Default values for go-api Helm chart

nameOverride: ""
fullnameOverride: ""
global:
  environment: k3d

# Namespace configuration
namespace:
  create: true
  name: go-api

# Deployment configuration
deployment:
  name: go-api
  replicaCount: 2

# Container image configuration
image:
  repository: go-api
  tag: v1.2.0
  pullPolicy: IfNotPresent

# Container port
port: 8080

# Service configuration
service:
  name: go-api
  type: ClusterIP
  port: 8080
  targetPort: 8080
  annotations: {}

# Ingress configuration
ingress:
  enabled: true
  className: traefik
  ingressAnnotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
  hosts:
    - host: go-api.k3d.local
      paths:
        - path: /
          pathType: Prefix
  tls:
    enabled: false

# Resource limits and requests
resources:
  requests:
    cpu: 100m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi

# Probes configuration
probes:
  liveness:
    enabled: true
    initialDelaySeconds: 15
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  readiness:
    enabled: true
    initialDelaySeconds: 10
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3

# Pod configuration
podAnnotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65534
  runAsGroup: 65534
  fsGroup: 65534

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# Environment variables
env:
  PORT: "8080"
  READINESS_FAILURE: "false"
  SHUTDOWN_TIMEOUT: "30s"

# Node selector
nodeSelector: {}

# Tolerations
tolerations: []

# Affinity
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app
                operator: In
                values:
                  - go-api
          topologyKey: kubernetes.io/hostname

# Autoscaling configuration
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

# Distributed tracing (OpenTelemetry).
# Off by default: with no collector listening, the OTLP exporter retries every
# batch and fills the log with export errors. The observability-sre scenario
# turns it on once Grafana Alloy is running, pointing the app at the collector
# rather than at Tempo directly — batching, retry and sampling belong in the
# collector, and the trace backend can then be swapped without redeploying.
tracing:
  enabled: false
  endpoint: http://alloy.monitoring.svc.cluster.local:4318
  serviceName: go-api

# Monitoring/Prometheus configuration
prometheus:
  enabled: true
  port: 8080
  path: /metrics

# ServiceMonitor for the Prometheus Operator.
# Off by default: this app is already scraped through the platform's annotation
# based "kubernetes-pods" job (it carries prometheus.io/scrape: "true"), so
# enabling this too would double-scrape /metrics and double every rate. Turn it
# on only if you also remove the pod's prometheus.io/scrape annotation and want
# the explicit ServiceMonitor path instead.
# releaseLabel must match the stack's serviceMonitorSelector (it selects
# ServiceMonitors labelled release=<its release name>, default "prometheus").
serviceMonitor:
  enabled: false
  releaseLabel: prometheus
  interval: 30s
  scrapeTimeout: 10s

# ConfigMap for additional configuration
configMap:
  enabled: false
  data: {}

# Secret management
secrets:
  enabled: false
  data: {}

# PodDisruptionBudget
podDisruptionBudget:
  enabled: false
  minAvailable: 1
  # maxUnavailable: 1
