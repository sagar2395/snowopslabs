name: gitops-cicd
verified: true
displayName: "GitOps & CI/CD"
description: "ArgoCD-based GitOps deployment with Application CRDs for declarative app management."
category: delivery
prerequisites:
  platform:
    - ingress
    - gitops/argocd
  apps: []
runtimes:
  - k3d
  - kind
components:
  - name: argocd
    type: helm
    chart: argo/argo-cd
    repo: https://argoproj.github.io/argo-helm
    version: "7.8.13"
    namespace: argocd
    valuesFile: values/argocd.yaml

  - name: argocd-apps
    type: manifest
    path: manifests/argocd-applications.yaml
    namespace: argocd

checks:
  - name: argocd-server-ready
    type: kubectl
    resource: deployment/argocd-server
    namespace: argocd
    jsonpath: "{.status.readyReplicas}"
    operator: ">="
    value: "1"

  - name: argocd-repo-server-ready
    type: kubectl
    resource: deployment/argocd-repo-server
    namespace: argocd
    jsonpath: "{.status.readyReplicas}"
    operator: ">="
    value: "1"

  - name: go-api-application-present
    type: kubectl
    resource: application/go-api
    namespace: argocd

  - name: echo-server-application-present
    type: kubectl
    resource: application/echo-server
    namespace: argocd

snippets:
  - label: "ArgoCD Application CRDs for go-api and echo-server"
    description: "The declarative GitOps contract: ArgoCD watches each app's Helm path in Git and keeps the cluster in sync. automated.prune + selfHeal mean drift is corrected automatically."
    path: manifests/argocd-applications.yaml

explore:
  urls:
    - label: "ArgoCD Dashboard"
      url: "http://argocd.{{.DomainSuffix}}"
  commands:
    - label: "Get ArgoCD admin password"
      command: "kubectl -n argocd get secret argocd-initial-admin-secret -o jsonpath='{.data.password}' | base64 -d; echo"
    - label: "List ArgoCD applications"
      command: "kubectl -n argocd get applications"
    - label: "Sync go-api application"
      command: "kubectl -n argocd patch application go-api --type merge -p '{\"operation\":{\"initiatedBy\":{\"username\":\"admin\"},\"sync\":{\"revision\":\"HEAD\"}}}'"
  tips:
    - "Login: username 'admin', password from the 'Get ArgoCD admin password' command above."
    - "Source of truth: ArgoCD syncs from the GitHub repo (github.com/sagar2395/snowopslabs @ HEAD), NOT your local working copy. It watches apps/go-api/deploy/helm and apps/echo-server/deploy/helm."
    - "To make an edit sync: commit and push it to that repo — or fork the repo, set 'repoURL' in manifests/argocd-applications.yaml to your fork, and re-apply the manifest."
    - "Two Applications are defined in manifests/argocd-applications.yaml (go-api, echo-server), each with automated sync (prune + selfHeal)."
    - "See sync/health status: kubectl -n argocd get applications. Force a sync now with the 'Sync go-api application' command above."
    - "Because selfHeal is on, editing the live resources directly (kubectl edit) is reverted by ArgoCD — change the git source instead."
