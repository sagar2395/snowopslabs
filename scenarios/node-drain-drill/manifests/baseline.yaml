# Exercise: nothing installs this file — the learner applies it.
#
# The PodDisruptionBudget is the whole point of the drill. Nothing stages it:
# without it, `kubectl drain` evicts every {{.WorkloadName}} pod on the node at once and
# the service drops requests. With it, the eviction of one pod blocks until a
# replacement is Ready elsewhere, so the drain proceeds without an outage.
#
#   labctl scenario render node-drain-drill manifests/baseline.yaml --app <app> | kubectl apply -f -
#
# maxUnavailable: 1 is the conservative choice. Try minAvailable instead, or a
# larger maxUnavailable, and watch how the drain's pace changes.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: "{{.WorkloadName}}-drill-pdb"
  namespace: "{{.WorkloadNamespace}}"
  labels:
    app.kubernetes.io/part-of: node-drain-drill
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app: "{{.WorkloadName}}"
