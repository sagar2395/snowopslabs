# The canary workloads labctl stages: two versions of {{.WorkloadName}} behind one
# Service, plus the DestinationRule that names the subsets a route can target.
#
# Both Deployments run the same image; APP_VERSION is what gives them distinct
# identities, so /version reports which subset served a request and the split is
# observable without building two images. The routing itself — the weighted
# VirtualService and the mTLS policy — is the learner's work, not staged here.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: "{{.WorkloadName}}-v1"
  namespace: "{{.WorkloadNamespace}}"
  labels:
    app: "{{.WorkloadName}}-canary"
    version: v1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: "{{.WorkloadName}}-canary"
      version: v1
  template:
    metadata:
      labels:
        app: "{{.WorkloadName}}-canary"
        version: v1
    spec:
      containers:
        - name: "{{.WorkloadName}}"
          image: "{{.WorkloadName}}:latest"
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: {{.WorkloadPort}}
          env:
            - name: PORT
              value: "{{.WorkloadPort}}"
            - name: APP_VERSION
              value: v1
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: "{{.WorkloadName}}-v2"
  namespace: "{{.WorkloadNamespace}}"
  labels:
    app: "{{.WorkloadName}}-canary"
    version: v2
spec:
  replicas: 1
  selector:
    matchLabels:
      app: "{{.WorkloadName}}-canary"
      version: v2
  template:
    metadata:
      labels:
        app: "{{.WorkloadName}}-canary"
        version: v2
    spec:
      containers:
        - name: "{{.WorkloadName}}"
          image: "{{.WorkloadName}}:latest"
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: {{.WorkloadPort}}
          env:
            - name: PORT
              value: "{{.WorkloadPort}}"
            - name: APP_VERSION
              value: v2
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: "{{.WorkloadName}}-canary"
  namespace: "{{.WorkloadNamespace}}"
  labels:
    app: "{{.WorkloadName}}-canary"
spec:
  selector:
    app: "{{.WorkloadName}}-canary"
  ports:
    - name: http
      port: 80
      targetPort: {{.WorkloadPort}}
---
# Subsets only name the versions; they carry no routing decision of their own.
# Without a VirtualService selecting them, the Service load-balances across both
# Deployments as if the mesh were not there.
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: "{{.WorkloadName}}-canary"
  namespace: "{{.WorkloadNamespace}}"
spec:
  host: "{{.WorkloadName}}-canary.{{.WorkloadNamespace}}.svc.cluster.local"
  subsets:
    - name: v1
      labels:
        version: v1
    - name: v2
      labels:
        version: v2
