# Canary workload: two {{.WorkloadName}} versions behind one Service, split 90/10 by an
# Istio VirtualService, with STRICT mTLS enforced on the canary pods.
# Both deployments use the existing {{.WorkloadName}} image; the "version" label is what
# the mesh splits on (a realistic canary shape without needing two real builds).
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: "{{.WorkloadName}}-v1"
  namespace: "{{.WorkloadNamespace}}"
  labels:
    app: "{{.WorkloadName}}-canary"
    version: v1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: "{{.WorkloadName}}-canary"
      version: v1
  template:
    metadata:
      labels:
        app: "{{.WorkloadName}}-canary"
        version: v1
    spec:
      containers:
        - name: "{{.WorkloadName}}"
          image: "{{.WorkloadName}}:latest"
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: PORT
              value: "8080"
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: "{{.WorkloadName}}-v2"
  namespace: "{{.WorkloadNamespace}}"
  labels:
    app: "{{.WorkloadName}}-canary"
    version: v2
spec:
  replicas: 1
  selector:
    matchLabels:
      app: "{{.WorkloadName}}-canary"
      version: v2
  template:
    metadata:
      labels:
        app: "{{.WorkloadName}}-canary"
        version: v2
    spec:
      containers:
        - name: "{{.WorkloadName}}"
          image: "{{.WorkloadName}}:latest"
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: PORT
              value: "8080"
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: "{{.WorkloadName}}-canary"
  namespace: "{{.WorkloadNamespace}}"
  labels:
    app: "{{.WorkloadName}}-canary"
spec:
  selector:
    app: "{{.WorkloadName}}-canary"
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: "{{.WorkloadName}}-canary"
  namespace: "{{.WorkloadNamespace}}"
spec:
  host: "{{.WorkloadName}}-canary.{{.WorkloadNamespace}}.svc.cluster.local"
  subsets:
    - name: v1
      labels:
        version: v1
    - name: v2
      labels:
        version: v2
---
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: "{{.WorkloadName}}-canary"
  namespace: "{{.WorkloadNamespace}}"
spec:
  hosts:
    - "{{.WorkloadName}}-canary.{{.WorkloadNamespace}}.svc.cluster.local"
  http:
    - route:
        - destination:
            host: "{{.WorkloadName}}-canary.{{.WorkloadNamespace}}.svc.cluster.local"
            subset: v1
          weight: 90
        - destination:
            host: "{{.WorkloadName}}-canary.{{.WorkloadNamespace}}.svc.cluster.local"
            subset: v2
          weight: 10
---
apiVersion: security.istio.io/v1beta1
kind: PeerAuthentication
metadata:
  name: "{{.WorkloadName}}-mtls"
  namespace: "{{.WorkloadNamespace}}"
spec:
  selector:
    matchLabels:
      app: "{{.WorkloadName}}-canary"
  mtls:
    mode: STRICT
