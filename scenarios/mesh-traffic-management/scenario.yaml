apiVersion: scenario.snowops.net/v2
name: mesh-traffic-management
verified: true
displayName: "Mesh Traffic Management"
description: "Istio canary release for {{.WorkloadName}}: a 90/10 weighted split between v1 and v2, mesh-level latency fault injection, and STRICT mTLS on the canary workload. Watch the split and faults in mesh telemetry."
category: networking
prerequisites:
  platform:
    - ingress
    - mesh
    - monitoring/metrics
  apps:
    - "{{.WorkloadName}}"
runtimes:
  - k3d
  - kind

objectives:
  - "Route traffic 90/10 across two {{.WorkloadName}} versions with an Istio VirtualService"
  - "Inject mesh-level latency without touching the app, and observe the impact"
  - "Enforce STRICT mTLS between meshed workloads and verify it"

stages:
  - name: canary-rollout
    description: Deploy v1 + v2, split 90/10, and require mTLS
    components:
      - name: canary
        type: manifest
        path: manifests/canary.yaml
        namespace: "{{.WorkloadNamespace}}"

  - name: fault-injection
    description: Add a mesh-level latency fault to a fraction of requests
    components:
      - name: latency-fault
        type: manifest
        path: manifests/fault-injection.yaml
        namespace: "{{.WorkloadNamespace}}"

# These assume the mesh provider is Istio (the default). Checks read CR/Deployment
# state via jsonpath — no text scraping.
checks:
  - name: istiod-ready
    type: kubectl
    resource: deployment/istiod
    namespace: istio-system
    jsonpath: "{.status.readyReplicas}"
    operator: ">="
    value: "1"

  - name: canary-v1-ready
    type: kubectl
    resource: deployment/{{.WorkloadName}}-v1
    namespace: "{{.WorkloadNamespace}}"
    jsonpath: "{.status.readyReplicas}"
    operator: ">="
    value: "1"

  - name: canary-v2-ready
    type: kubectl
    resource: deployment/{{.WorkloadName}}-v2
    namespace: "{{.WorkloadNamespace}}"
    jsonpath: "{.status.readyReplicas}"
    operator: ">="
    value: "1"

  - name: virtualservice-present
    type: kubectl
    resource: virtualservice/{{.WorkloadName}}-canary
    namespace: "{{.WorkloadNamespace}}"

  - name: mtls-strict-present
    type: kubectl
    resource: peerauthentication/{{.WorkloadName}}-mtls
    namespace: "{{.WorkloadNamespace}}"

references:
  - label: "Istio — Traffic management (VirtualService & DestinationRule)"
    url: "https://istio.io/latest/docs/concepts/traffic-management/"
    note: "The concepts behind manifests/canary.yaml: subsets, weighted routes, and how the 90/10 split is expressed."
  - label: "Istio — Fault injection"
    url: "https://istio.io/latest/docs/tasks/traffic-management/fault-injection/"
    note: "Mesh-level delay/abort faults, exactly what the fault-injection stage applies to the v2 subset."
  - label: "Istio — Mutual TLS (PeerAuthentication)"
    url: "https://istio.io/latest/docs/tasks/security/authentication/mtls-migration/"
    note: "Why STRICT mode rejects plaintext sidecar-less clients."

snippets:
  - label: "Canary VirtualService + DestinationRule (90/10 v1/v2 split)"
    description: "The weighted route this scenario installs. Shift spec.http[0].route weights and re-apply to promote the canary."
    path: manifests/canary.yaml
  - label: "Mesh-level latency fault on the v2 subset"
    description: "Adds a fixed delay to v2 without touching the app — applied by the fault-injection stage."
    path: manifests/fault-injection.yaml

explore:
  urls:
    - label: "Grafana — {{.WorkloadName}} requests (v1/v2 traffic split)"
      url: "http://grafana.{{.DomainSuffix}}/d/app-requests"
  commands:
    - label: "Send 20 requests and watch the 90/10 split by version"
      command: "for i in $(seq 1 20); do kubectl -n {{.WorkloadNamespace}} exec deploy/{{.WorkloadName}}-v1 -c {{.WorkloadName}} -- wget -qO- http://{{.WorkloadName}}-canary/version 2>/dev/null; done | sort | uniq -c"
    - label: "Observe the injected latency (v2 path delayed)"
      command: "kubectl -n {{.WorkloadNamespace}} exec deploy/{{.WorkloadName}}-v1 -c {{.WorkloadName}} -- sh -c 'time wget -qO- http://{{.WorkloadName}}-canary/health'"
    - label: "Verify mTLS is STRICT on the canary workload"
      command: "kubectl -n {{.WorkloadNamespace}} get peerauthentication {{.WorkloadName}}-mtls -o jsonpath='{.spec.mtls.mode}{\"\\n\"}'"
    - label: "Inspect the weighted route"
      command: "kubectl -n {{.WorkloadNamespace}} get virtualservice {{.WorkloadName}}-canary -o jsonpath='{.spec.http[0].route}{\"\\n\"}'"
  tips:
    - "Subsets v1/v2 are selected by the pod label 'version'; the DestinationRule maps them."
    - "Grafana → the linked {{.WorkloadName}} requests dashboard: with the 90/10 split v2 should carry ~10% of requests. Shift the VirtualService weights, re-apply, and watch the balance move."
    - "Shift the split by editing spec.http[0].route weights and re-applying — canary promotion."
    - "The fault-injection stage adds a fixed delay to the v2 subset; mesh-level, no app change."
    - "STRICT mTLS means plaintext clients without a sidecar are rejected — that is the security win."
    - "This scenario targets Istio (the default mesh provider); Linkerd uses different CRDs."
