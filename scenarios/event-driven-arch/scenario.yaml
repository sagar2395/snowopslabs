apiVersion: scenario.snowops.net/v2
name: event-driven-arch
verified: true
displayName: "Event-Driven Architecture"
description: "A producer/consumer flow through Kafka (Strimzi): an 'orders' topic with a continuous producer and a consumer group. Stage 2 ramps producers to build consumer lag — observe it, then scale consumers (manually or with KEDA's Kafka scaler) to drain it."
category: data
prerequisites:
  platform:
    - data/kafka
    # The scenario ships PodMonitors and Grafana dashboards; without the
    # monitoring stack they apply cleanly and then show nothing.
    - monitoring/metrics
    - monitoring/grafana
  apps:
    - go-api
runtimes:
  - k3d
  - kind

objectives:
  - "Run a producer/consumer event flow through a Kafka topic"
  - "Create consumer lag by ramping producers past consumer throughput"
  - "Drain the lag by scaling consumers (manually or via KEDA's Kafka lag scaler)"

stages:
  - name: event-flow
    description: Create the topic and run one producer + one consumer
    components:
      - name: orders-topic
        type: manifest
        path: manifests/topic.yaml
        namespace: kafka

      - name: producer-consumer
        type: manifest
        path: manifests/producer-consumer.yaml
        namespace: kafka

      - name: kafka-metrics
        type: manifest
        path: manifests/kafka-metrics.yaml
        namespace: kafka

      - name: kafka-lag-dashboard
        type: grafana-dashboard
        path: dashboards/

  - name: build-lag
    description: Ramp producers to 3x so the single consumer falls behind
    components:
      - name: ramp-producers
        type: manifest
        path: manifests/ramp-producers.yaml
        namespace: kafka

checks:
  - name: kafka-cluster-ready
    type: kubectl
    resource: kafka/lab-kafka
    namespace: kafka
    jsonpath: '{.status.conditions[?(@.type=="Ready")].status}'
    operator: "=="
    value: "True"

  - name: orders-topic-ready
    type: kubectl
    resource: kafkatopic/orders
    namespace: kafka
    jsonpath: '{.status.conditions[?(@.type=="Ready")].status}'
    operator: "=="
    value: "True"

  - name: producer-running
    type: kubectl
    resource: deployment/orders-producer
    namespace: kafka
    jsonpath: "{.status.readyReplicas}"
    operator: ">="
    value: "1"

  - name: consumer-running
    type: kubectl
    resource: deployment/orders-consumer
    namespace: kafka
    jsonpath: "{.status.readyReplicas}"
    operator: ">="
    value: "1"

  # The dashboards are only useful if Prometheus is actually scraping Kafka.
  # These two checks turn "the dashboard is empty" from a mystery into a
  # failing check that names the cause.
  - name: broker-metrics-scraped
    type: promql
    query: 'count(kafka_server_replicamanager_partitioncount)'
    operator: ">="
    value: "1"
    remediation: "Prometheus is not scraping the Kafka brokers. Check that the Kafka CR has spec.kafka.metricsConfig (platform/data/kafka/install.sh applies the kafka-metrics ConfigMap), and that the kafka-broker PodMonitor is selected: kubectl -n kafka get podmonitor kafka-broker -o yaml — it needs the release label the Prometheus CR's podMonitorSelector expects."

  - name: consumer-lag-metrics-scraped
    type: promql
    query: 'count(kafka_consumergroup_lag{topic="orders"})'
    operator: ">="
    value: "1"
    remediation: "The kafka-exporter metrics are missing. Confirm the exporter pod is running (kubectl -n kafka get pods -l strimzi.io/name=lab-kafka-kafka-exporter) and that Prometheus selected the kafka-exporter PodMonitor (Status > Targets in the Prometheus UI)."

snippets:
  - label: "The 'orders' Kafka topic (3 partitions)"
    description: "A Strimzi KafkaTopic. Three partitions let the consumer group scale to three parallel consumers."
    path: manifests/topic.yaml
  - label: "Producer + consumer group on the orders topic"
    description: "A continuous producer (one order every ~0.5s) and a consumer in the 'order-processors' group, built from Kafka's console tools — no custom app needed."
    path: manifests/producer-consumer.yaml

explore:
  urls:
    - label: "Grafana — Kafka Overview (cluster health, throughput, lag)"
      url: "http://grafana.{{.DomainSuffix}}/d/kafka-overview"
    - label: "Grafana — Kafka consumer-lag dashboard (lag, produce/consume rate)"
      url: "http://grafana.{{.DomainSuffix}}/d/event-driven-arch"
    - label: "Prometheus — are the Kafka targets being scraped?"
      url: "http://prometheus.{{.DomainSuffix}}/targets"
  commands:
    - label: "Watch consumer-group lag build and drain"
      command: "kubectl -n kafka exec -it lab-kafka-dual-role-0 -- bin/kafka-consumer-groups.sh --bootstrap-server localhost:9092 --describe --group order-processors"
    - label: "Tail what the consumer is processing"
      command: "kubectl -n kafka logs deploy/orders-consumer --tail=20 -f"
    - label: "Drain the lag by scaling consumers up"
      command: "kubectl -n kafka scale deployment/orders-consumer --replicas=3"
    - label: "List topics"
      command: "kubectl -n kafka exec -it lab-kafka-dual-role-0 -- bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"
    - label: "Describe a topic — partitions, leader, replicas, ISR"
      command: "kubectl -n kafka exec -it lab-kafka-dual-role-0 -- bin/kafka-topics.sh --bootstrap-server localhost:9092 --describe --topic orders"
    - label: "See the raw broker metrics Prometheus scrapes"
      command: "kubectl -n kafka exec lab-kafka-dual-role-0 -- curl -s localhost:9404/metrics | grep -E 'kafka_server_brokertopicmetrics|underreplicated' | head"
    - label: "Confirm Prometheus picked up both Kafka PodMonitors"
      command: "kubectl -n kafka get podmonitor && kubectl -n {{.MonitoringNamespace}} get prometheus -o jsonpath='{.items[0].spec.podMonitorSelector}'"
  tips:
    - "Two dashboards: 'Kafka Overview' (uid kafka-overview) for cluster health and throughput, and 'Event-Driven — Kafka Consumer Lag' (uid event-driven-arch) for the lag exercise itself."
    - "Kafka metrics come from TWO sources and you need both. The brokers expose JMX via spec.kafka.metricsConfig on the Kafka CR (throughput, under-replicated partitions, request latency); the separate kafka-exporter sidecar exposes consumer-group lag and topic offsets. A Kafka CR without metricsConfig publishes no broker metrics at all — the dashboard renders, and every broker panel stays empty."
    - "If a panel is empty, check the scrape before the query: Prometheus > Status > Targets. kube-prometheus-stack only selects PodMonitors matching its podMonitorSelector, so a PodMonitor can exist and still be ignored."
    - "Lag = messages produced but not yet consumed for the 'order-processors' group."
    - "The 'orders' topic has 3 partitions, so up to 3 consumers in the group share the load."
    - "Stage 2 ramps producers to 3x; a single consumer falls behind and lag climbs."
    - "Scale orders-consumer to 3 to drain the lag, or install autoscaling/keda and add a Kafka-lag ScaledObject to do it automatically."
    - "Broker pod name is lab-kafka-dual-role-0 (the KRaft node pool from task 055)."
