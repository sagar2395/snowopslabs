# Stage 2 — the pressure. Re-applies the producer Deployment (same name) at 3
# replicas emitting five times as fast: roughly 29 orders/second against a
# consumer group that can process about 18. Lag then climbs at ~11/s, which is
# what the learner has to diagnose and drain.
#
# The producers stay ramped for the whole exercise. Draining by stopping them is
# not a fix, and 'producers-still-ramped' grades that.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders-producer
  namespace: kafka
  labels:
    app: orders-producer
spec:
  replicas: 3
  selector:
    matchLabels:
      app: orders-producer
  template:
    metadata:
      labels:
        app: orders-producer
    spec:
      containers:
        - name: producer
          image: apache/kafka:4.3.1
          command: ["/bin/sh", "-c"]
          args:
            - |
              PAD=xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
              PAD=$PAD$PAD$PAD$PAD
              PAD=$PAD$PAD$PAD$PAD
              PAD=$PAD$PAD
              while true; do
                echo "{\"id\":\"order-$(date +%s)-${RANDOM}\",\"items\":3,\"body\":\"$PAD\"}";
                sleep 0.1;
              done | /opt/kafka/bin/kafka-console-producer.sh \
                --bootstrap-server lab-kafka-kafka-bootstrap:9092 \
                --topic orders
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 384Mi
