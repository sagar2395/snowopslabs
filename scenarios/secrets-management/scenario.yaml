apiVersion: scenario.snowops.net/v2
name: secrets-management
verified: true
displayName: "Secrets Management & Rotation"
description: "A workload mounts a Vault-backed secret that External Secrets keeps in sync. You rotate the value in Vault; it must reach the running pod through ESO and the kubelet with no restart and no redeploy. The grade is what the running container reads from disk."
category: security
prerequisites:
  platform:
    - secrets/vault
    - secrets/external-secrets
    - monitoring/metrics
  apps:
    - "{{.WorkloadName}}"
runtimes:
  - k3d
  - kind

objectives:
  - "Compare two workloads consuming the same Vault-backed Secret — one as a file, one as an env var"
  - "Rotate the value in Vault with the vault CLI and watch it flow through ESO to the pod"
  - "Prove the rotation reached the file-mounted container with no restart and no redeploy"
  - "Show the env-var container never sees it, and say why that is not a bug"
  - "Read the rotation on ESO's own metrics rather than by polling kubectl"

stages:
  - name: consume
    description: Seed a known baseline in Vault and stand up two consumers of the same Secret — one mounting it as a file, one taking it as an env var
    components:
      - name: secret-consumers
        type: manifest
        path: manifests/consumer.yaml
        namespace: "{{.WorkloadNamespace}}"

      - name: seed-baseline
        type: script
        script: scripts/seed-baseline.sh
        uninstallScript: scripts/restore-baseline.sh

      - name: rotation-dashboard
        type: grafana-dashboard
        path: dashboards/
        namespace: "{{.MonitoringNamespace}}"

checks:
  - name: eso-controller-ready
    type: kubectl
    resource: deployment/external-secrets
    namespace: external-secrets
    jsonpath: "{.status.readyReplicas}"
    operator: ">="
    value: "1"
    remediation: "The sync operator is down. Install or repair it: labctl platform up secrets/external-secrets"

  - name: externalsecret-ready
    type: kubectl
    resource: externalsecret/{{.WorkloadName}}-secret
    namespace: "{{.WorkloadNamespace}}"
    jsonpath: '{.status.conditions[?(@.type=="Ready")].status}'
    operator: "=="
    value: "True"
    remediation: "ESO cannot sync from Vault. Check the reason: kubectl -n {{.WorkloadNamespace}} describe externalsecret {{.WorkloadName}}-secret — a SecretSyncedError usually means the vault-token secret is wrong or Vault is sealed."

  # Two failures in one probe: no series at all means Prometheus is not scraping
  # ESO, and a series pinned at 0 means ESO is scraped and reporting that it
  # cannot sync. The old form counted series, which stayed at 2 through a
  # seven-hour outage.
  - name: eso-reports-synced
    type: promql
    query: 'max(externalsecret_status_condition{name="{{.WorkloadName}}-secret",condition="Ready",status="True"})'
    operator: ">="
    value: "1"
    remediation: "ESO's own metrics say this ExternalSecret is not Ready — or Prometheus is not scraping ESO at all, in which case the Secret Rotation dashboard is empty too. Read the reason: kubectl -n {{.WorkloadNamespace}} get externalsecret {{.WorkloadName}}-secret -o jsonpath='{.status.conditions[*].message}'. If Vault holds the value but ESO does not, it is in backoff after a Vault restart — nudge it: kubectl -n {{.WorkloadNamespace}} annotate externalsecret {{.WorkloadName}}-secret force-sync=$(date +%s) --overwrite"

  - name: consumers-running
    type: kubectl
    resource: deployment/env-consumer
    namespace: "{{.WorkloadNamespace}}"
    jsonpath: "{.status.readyReplicas}"
    operator: ">="
    value: "1"
    remediation: "The env-var control workload is not running. Re-activate the scenario: labctl scenario up secrets-management --force"

  - name: consumer-mounted
    type: kubectl
    resource: deployment/secret-consumer
    namespace: "{{.WorkloadNamespace}}"
    jsonpath: "{.status.readyReplicas}"
    operator: ">="
    value: "1"
    remediation: "The workload that reads the secret from disk is not running. Re-activate the scenario: labctl scenario up secrets-management --force"

  - name: rotation-performed
    type: script
    script: checks/check-rotation-performed.sh
    pending: true
    remediation: "You have not rotated the secret yet. Rotate it in Vault: kubectl -n vault exec vault-0 -- sh -c 'VAULT_ADDR=http://127.0.0.1:8200 VAULT_TOKEN=root vault kv put secret/{{.WorkloadName}} api-key=rotated-v2'"

  - name: rotation-reached-pod
    type: script
    script: checks/check-propagated-to-pod.sh
    timeoutSeconds: 60
    pending: true
    remediation: "The rotation has not reached the container's file yet. ESO refreshes every 15s and the kubelet updates the mounted file on its own cycle, so allow ~90s, then re-run verify. Watch it land with: kubectl -n {{.WorkloadNamespace}} logs -l app=secret-consumer -f"

  - name: no-redeploy-needed
    type: script
    script: checks/check-no-restart.sh
    pending: true
    remediation: "The consumer restarted or was redeployed, so this run cannot prove in-place propagation. Reset and rotate again without touching the Deployment: labctl scenario reset secrets-management"

  - name: env-consumer-did-not-see-it
    type: script
    script: checks/check-env-consumer-stale.sh
    pending: true
    remediation: "Rotate the secret in Vault, then compare the two pods: the file-mounted one picks the new value up, the env-var one does not. If both already agree, the env-var pod restarted and re-read the Secret — reset and rotate again: labctl scenario reset secrets-management"

references:
  - label: "Kubernetes — Secrets: mounted secrets are updated automatically"
    url: "https://kubernetes.io/docs/concepts/configuration/secret/#mounted-secrets-are-updated-automatically"
    note: "The kubelet's own statement of the rule this drill turns into a measurement — and the paragraph immediately after it, which says an env-var secret is never updated."
  - label: "External Secrets Operator — ExternalSecret and refreshInterval"
    url: "https://external-secrets.io/latest/api/externalsecret/"
    note: "What refreshInterval does and does not promise, and the force-sync annotation that breaks a backoff."
  - label: "External Secrets Operator — HashiCorp Vault provider"
    url: "https://external-secrets.io/latest/provider/hashicorp-vault/"
    note: "KV v1 vs v2 paths and token auth — the two things a SecretStore usually gets wrong."
  - label: "HashiCorp Vault — KV version 2 secrets engine"
    url: "https://developer.hashicorp.com/vault/docs/secrets/kv/kv-v2"
    note: "Why 'vault kv put secret/<name>' writes to secret/data/<name>, and how versioning makes a rotation reversible."

snippets:
  - label: "The same secret, mounted as a file and taken as an env var"
    description: "A file-mounted secret is the reason rotation works without a redeploy: the kubelet rewrites the file in place when the Secret changes, and the process re-reads it. The same secret consumed via envFrom would be frozen at process start — that is the distinction this scenario exists to teach."
    path: manifests/consumer.yaml

explore:
  urls:
    - label: "Grafana — Secret Rotation (ESO sync calls, readiness, Vault API)"
      url: "http://grafana.{{.DomainSuffix}}/d/secret-rotation"
    - label: "Vault UI (token auth — use your dev root token)"
      url: "http://vault.{{.DomainSuffix}}"
  commands:
    - label: "1. Watch the file-mounted consumer read the secret from disk (leave this running)"
      command: "kubectl -n {{.WorkloadNamespace}} logs -l app=secret-consumer -f"
    - label: "2. Confirm the baseline the stage seeded"
      command: "kubectl -n vault exec vault-0 -- sh -c 'VAULT_ADDR=http://127.0.0.1:8200 VAULT_TOKEN=root vault kv get secret/{{.WorkloadName}}'"
    - label: "3. Rotate the secret in Vault — this is the drill; pick any new value"
      command: "kubectl -n vault exec vault-0 -- sh -c 'VAULT_ADDR=http://127.0.0.1:8200 VAULT_TOKEN=root vault kv put secret/{{.WorkloadName}} api-key=rotated-v2'"
    - label: "4. Watch the new value appear in terminal 1 — no restart, no redeploy (~90s)"
      command: "kubectl -n {{.WorkloadNamespace}} get pod -l app=secret-consumer -o jsonpath='{.items[0].status.containerStatuses[0].restartCount}{\"\\n\"}'"
    - label: "5. Compare the two consumers — the file moved, the environment did not"
      command: "kubectl -n {{.WorkloadNamespace}} exec deploy/secret-consumer -- cat /etc/api/api-key; kubectl -n {{.WorkloadNamespace}} exec deploy/env-consumer -- sh -c 'echo $API_KEY'"
    - label: "6. Grade the rotation"
      command: "labctl scenario verify secrets-management"
    - label: "Inspect the sync contract ESO is honouring"
      command: "kubectl -n {{.WorkloadNamespace}} describe externalsecret {{.WorkloadName}}-secret"
  tips:
    - "Rotate in Vault, never in Kubernetes. Editing the Secret directly is undone at ESO's next refresh — that is the operator doing its job, and it is the habit this scenario is trying to build."
    - "Propagation is two hops, not one: ESO refreshes the Secret every 15s, then the kubelet refreshes the mounted file on its own cycle. End to end it can take ~90s, so 'rotation-reached-pod' showing PENDING for a minute is normal, not broken."
    - "The Vault->Secret wiring (SecretStore, ExternalSecret, vault-token) belongs to the secrets/external-secrets platform component. This scenario only seeds a value and mounts the result, so tearing it down leaves that wiring intact."
    - "env-consumer is the control group, not a broken pod. The kubelet cannot rewrite a running process's environment, so an env-var secret is frozen at start and only a rollout moves it. That is why it still shows the old value, and why file mounts are the answer when you want rotation to be free."
    - "Binding the key explicitly (secretKeyRef) rather than envFrom is deliberate: 'api-key' is not a valid environment variable name, and envFrom would skip it silently with an InvalidVariableNames event."
    - "Dev-mode Vault keeps data in memory. If vault-0 restarts, its KV is wiped — re-run 'labctl scenario up secrets-management --force' to reseed the baseline."
    - "After a Vault restart ESO does not recover on its own timetable. Every failed read backs it off exponentially, so within a few hours it is retrying hours apart, not every 15s — re-seeding the value alone changes nothing, because the reconcile that would notice is not due. Break the backoff with ESO's own idiom: kubectl -n {{.WorkloadNamespace}} annotate externalsecret {{.WorkloadName}}-secret force-sync=$(date +%s) --overwrite. Activation does this for you; worth knowing when you meet it on a real cluster."
    - "Careful reading ESO's metrics: the 'namespace' label on externalsecret_* is the CONTROLLER's namespace (external-secrets). Prometheus moved the real one to 'exported_namespace' to avoid the collision. Select on 'name', or on 'exported_namespace' — never on 'namespace'."
    - "A successful rotation looks like nothing on ESO's metrics: it reconciles every 15s whether the value moved or not. The dashboard is there for the FAILURE shape — sync errors climbing, Ready dropping to 0 — and the last hop into the container's file is not instrumented at all. That one you watch in the consumer's logs."
    - "Never commit tokens: the dev root token comes from VAULT_DEV_ROOT_TOKEN (default 'root')."
