# A workload that consumes the synced Secret as a FILE, not an env var.
# This is the point of the drill: a file-mounted secret is updated in place by the
# kubelet when the Secret changes, so a rotation reaches a running pod with no
# restart. An env var is captured at process start and would need a redeploy.
#
# The Secret and its ExternalSecret are owned by the secrets/external-secrets
# platform component; this scenario only mounts what that component publishes.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: secret-consumer
  namespace: go-api
  labels:
    app: secret-consumer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: secret-consumer
  template:
    metadata:
      labels:
        app: secret-consumer
    spec:
      containers:
        - name: consumer
          image: busybox:1.36.1
          # Re-read the file every 5s so the pod log shows the rotation landing.
          command:
            - sh
            - -c
            - 'while true; do echo "$(date -Iseconds) api-key=$(cat /etc/api/api-key)"; sleep 5; done'
          volumeMounts:
            - name: api-secret
              mountPath: /etc/api
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
      volumes:
        - name: api-secret
          secret:
            secretName: go-api-secrets
---
# The control group. Same secret, consumed as an ENV VAR instead of a file.
# The kubelet cannot rewrite a process's environment, so this container keeps
# whatever value existed when it started and a rotation never reaches it. The
# contrast between the two pods after one rotation is the lesson.
#
# The key is bound explicitly because 'api-key' is not a valid env var name:
# envFrom would silently skip it (InvalidVariableNames).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: env-consumer
  namespace: go-api
  labels:
    app: env-consumer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: env-consumer
  template:
    metadata:
      labels:
        app: env-consumer
    spec:
      containers:
        - name: consumer
          image: busybox:1.36.1
          command:
            - sh
            - -c
            - 'while true; do echo "$(date -Iseconds) api-key=$API_KEY (from env, frozen at start)"; sleep 5; done'
          env:
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: go-api-secrets
                  key: api-key
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
