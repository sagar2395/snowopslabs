# Syncs Vault's secret/<app> into the Secret the two consumers read.
#
# The secrets/external-secrets platform component installs the operator and
# the vault-backend ClusterSecretStore and names no app. This scenario brings
# the ExternalSecret for the app it is bound to, so activating it for any app
# works and `scenario down` removes it (and, through creationPolicy: Owner, the
# Secret it wrote).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: "{{.WorkloadName}}-secret"
  namespace: "{{.WorkloadNamespace}}"
spec:
  refreshInterval: 15s
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: "{{.WorkloadName}}-secrets"
    creationPolicy: Owner
  data:
    - secretKey: api-key
      remoteRef:
        key: "{{.WorkloadName}}"
        property: api-key
