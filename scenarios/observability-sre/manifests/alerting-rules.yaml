apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: scenario-observability-sre-alerts
  namespace: "{{.MonitoringNamespace}}"
  labels:
    # Must match the kube-prometheus-stack release name ("prometheus"). A wrong
    # value here does not error — Prometheus simply never loads the rules.
    release: prometheus
spec:
  groups:
    - name: sre.availability
      rules:
        - alert: HighErrorRate
          expr: |
            (
              sum(rate({{.WorkloadMetric}}_count{http_response_status_code=~"5..",app="{{.WorkloadName}}"}[5m]))
              /
              sum(rate({{.WorkloadMetric}}_count{app="{{.WorkloadName}}"}[5m]))
            ) > 0.05
          for: 2m
          labels:
            severity: critical
            scenario: observability-sre
          annotations:
            summary: "High error rate on {{.WorkloadName}}"
            description: "Error rate is above 5% for the last 2 minutes (current: {{ $value | humanizePercentage }})"

        - alert: HighLatency
          expr: |
            histogram_quantile(0.99, sum(rate({{.WorkloadMetric}}_bucket{app="{{.WorkloadName}}"}[5m])) by (le))
            > 1.0
          for: 2m
          labels:
            severity: warning
            scenario: observability-sre
          annotations:
            summary: "High p99 latency on {{.WorkloadName}}"
            description: "p99 latency is above 1s for the last 2 minutes (current: {{ $value }}s)"

    - name: sre.saturation
      rules:
        # kube-state-metrics for the limit, not cAdvisor's
        # container_spec_memory_limit_bytes: that series is absent on k3s and
        # kind, so the original rule divided by nothing and could never fire.
        - alert: PodMemoryHigh
          expr: |
            max by (pod) (container_memory_working_set_bytes{namespace="{{.WorkloadNamespace}}", container!=""})
            /
            max by (pod) (kube_pod_container_resource_limits{namespace="{{.WorkloadNamespace}}", resource="memory"})
            > 0.85
          for: 5m
          labels:
            severity: warning
            scenario: observability-sre
          annotations:
            summary: "Pod memory usage above 85%"
            description: "{{.WorkloadName}} pod memory usage is {{ $value | humanizePercentage }}"

        # The fraction of CFS periods that were throttled. cAdvisor here
        # exposes throttled_periods_total, not throttled_seconds_total, so the
        # original rule referenced a series that does not exist.
        - alert: PodCPUThrottled
          expr: |
            sum by (pod) (rate(container_cpu_cfs_throttled_periods_total{namespace="{{.WorkloadNamespace}}", container!=""}[5m]))
            /
            clamp_min(sum by (pod) (rate(container_cpu_cfs_periods_total{namespace="{{.WorkloadNamespace}}", container!=""}[5m])), 0.001)
            > 0.25
          for: 5m
          labels:
            severity: warning
            scenario: observability-sre
          annotations:
            summary: "Pod CPU throttling detected"
            description: "{{.WorkloadName}} is being CPU throttled"

    - name: sre.readiness
      rules:
        - alert: PodNotReady
          expr: |
            kube_pod_status_ready{namespace="{{.WorkloadNamespace}}", condition="true"} == 0
          for: 1m
          labels:
            severity: critical
            scenario: observability-sre
          annotations:
            summary: "{{.WorkloadName}} pod not ready"
            description: "Pod {{ $labels.pod }} has been not ready for 1 minute"

        - alert: DeploymentReplicasMismatch
          expr: |
            kube_deployment_spec_replicas{namespace="{{.WorkloadNamespace}}"}
            !=
            kube_deployment_status_ready_replicas{namespace="{{.WorkloadNamespace}}"}
          for: 3m
          labels:
            severity: warning
            scenario: observability-sre
          annotations:
            summary: "Deployment replicas mismatch"
            description: "Deployment {{ $labels.deployment }} has {{ $value }} replicas mismatch for 3 minutes"
