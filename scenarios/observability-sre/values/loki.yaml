# Loki single-binary mode for local development
deploymentMode: SingleBinary
loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  limits_config:
    retention_period: {{.LokiRetentionPeriod}}
  compactor:
    retention_enabled: true
    delete_request_store: filesystem
  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h
singleBinary:
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  persistence:
    enabled: true
    size: 5Gi

# Disable components not needed in single-binary mode
read:
  replicas: 0
write:
  replicas: 0
backend:
  replicas: 0

# Memcached caches are enabled by default in the Loki chart and each requests
# ~9.6Gi of memory — larger than a laptop lab cluster, so the chunks-cache pod
# stays permanently Pending and the whole scenario never converges. They add
# nothing to a single-binary, filesystem-backed lab, so turn them off.
chunksCache:
  enabled: false
resultsCache:
  enabled: false

# Gateway
gateway:
  enabled: true
  replicas: 1

# Monitoring
monitoring:
  selfMonitoring:
    enabled: false
    grafanaAgent:
      installOperator: false
  lokiCanary:
    enabled: false

# Disable test
test:
  enabled: false
