## Kyverno overlay for security-compliance.
## Base values come from platformValues: security/policy/kyverno (ADR-0010) —
## this file adds ONLY what the scenario needs on top: Prometheus scraping, so
## the security dashboard's policy panels have data instead of "No data".
##
## The reports controller emits kyverno_policy_results_total (the violation
## counts); the admission controller emits kyverno_admission_review_duration_*.
## The dashboard plots both, so both ServiceMonitors are required.

admissionController:
  serviceMonitor:
    enabled: true

backgroundController:
  serviceMonitor:
    enabled: true

cleanupController:
  serviceMonitor:
    enabled: true

reportsController:
  serviceMonitor:
    enabled: true
