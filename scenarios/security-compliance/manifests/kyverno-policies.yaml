# Kyverno ClusterPolicies for the security-compliance scenario.
#
# Every policy ships with validate.failureAction: Audit — the mode a real team
# starts in. Audit records violations in policy reports without rejecting
# anything, so turning policy on cannot take production down. Moving a policy to
# Enforce once its violations are cleared is the drill this scenario grades.
#
# failureAction is per-rule (spec.validationFailureAction is deprecated), so
# a policy can be promoted one rule at a time.
#
# System namespaces are excluded because platform components legitimately need
# root, host paths and unbounded limits; enforcing pod-security on them would
# wedge the cluster rather than teach anything.
---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: deny-privilege-escalation
  annotations:
    policies.kyverno.io/title: Deny Privilege Escalation
    policies.kyverno.io/category: Pod Security Standards
    policies.kyverno.io/severity: high
    policies.kyverno.io/description: >-
      Privilege escalation allows a container process to gain more privileges
      than its parent process. This is almost never needed in lab workloads
      and is a common attack vector. All containers must set
      allowPrivilegeEscalation: false.
spec:
  background: true
  rules:
    - name: deny-privilege-escalation
      match:
        any:
          - resources:
              kinds:
                - Pod
      exclude:
        any:
          - resources:
              namespaces:
                - kube-system
                - kyverno
                - cert-manager
                - monitoring
                - traefik
                - istio-system
                - argocd
                - chaos-mesh
      validate:
        failureAction: Audit
        message: "Privilege escalation is not allowed. Set securityContext.allowPrivilegeEscalation: false."
        pattern:
          spec:
            containers:
              - securityContext:
                  allowPrivilegeEscalation: false
---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-non-root-user
  annotations:
    policies.kyverno.io/title: Require Non-Root User
    policies.kyverno.io/category: Pod Security Standards
    policies.kyverno.io/severity: medium
    policies.kyverno.io/description: >-
      Containers should not run as root. Requiring runAsNonRoot: true forces
      the runtime to reject any image whose entrypoint would run as UID 0.
spec:
  background: true
  rules:
    - name: require-run-as-non-root
      match:
        any:
          - resources:
              kinds:
                - Pod
      exclude:
        any:
          - resources:
              namespaces:
                - kube-system
                - kyverno
                - cert-manager
                - monitoring
                - traefik
                - istio-system
                - argocd
                - chaos-mesh
      validate:
        failureAction: Audit
        message: "Containers must not run as root. Set securityContext.runAsNonRoot: true."
        pattern:
          spec:
            containers:
              - securityContext:
                  runAsNonRoot: true
---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-resource-limits
  annotations:
    policies.kyverno.io/title: Require Resource Limits
    policies.kyverno.io/category: Best Practices
    policies.kyverno.io/severity: medium
    policies.kyverno.io/description: >-
      Containers without CPU and memory limits can starve other workloads.
      All containers must specify both cpu and memory limits.
spec:
  background: true
  rules:
    - name: require-resource-limits
      match:
        any:
          - resources:
              kinds:
                - Pod
      exclude:
        any:
          - resources:
              namespaces:
                - kube-system
                - kyverno
                - cert-manager
                - monitoring
                - traefik
                - istio-system
                - argocd
                - chaos-mesh
      validate:
        failureAction: Audit
        message: "Containers must declare CPU and memory limits."
        pattern:
          spec:
            containers:
              - resources:
                  limits:
                    memory: "?*"
                    cpu: "?*"
---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-latest-tag
  annotations:
    policies.kyverno.io/title: Disallow Latest Tag
    policies.kyverno.io/category: Best Practices
    policies.kyverno.io/severity: medium
    policies.kyverno.io/description: >-
      Using :latest or no tag makes deployments non-reproducible. All container
      images must reference an explicit version tag.
spec:
  background: true
  rules:
    - name: deny-latest-tag
      match:
        any:
          - resources:
              kinds:
                - Pod
      exclude:
        any:
          - resources:
              namespaces:
                - kube-system
                - kyverno
                - cert-manager
                - monitoring
                - traefik
                - istio-system
                - argocd
                - chaos-mesh
      validate:
        failureAction: Audit
        message: "Using ':latest' tag is not allowed. Specify an explicit image version tag."
        pattern:
          spec:
            containers:
              - image: "!*:latest"
