apiVersion: scenario.snowops.net/v2
name: cost-right-sizing
displayName: "Cost & Capacity: Right-Sizing Over-Provisioned Resources"
description: "Deploy go-api with deliberately over-provisioned CPU and memory requests, observe the inflated cost in OpenCost, then right-size the requests to a realistic baseline. Checks verify that requests were reduced to the target thresholds while go-api stays healthy under traffic. Teaches the observe-measure-reduce loop that keeps platform costs rational."
category: cost
prerequisites:
  platform:
    - cost/opencost
    - monitoring/metrics
    - ingress
  apps:
    - go-api
runtimes:
  - k3d
  - kind

objectives:
  - "Observe go-api's inflated cost in OpenCost and relate it to over-provisioned CPU/memory requests"
  - "Right-size the CPU request from 2000m to ≤100m and memory request from 1Gi to ≤256Mi"
  - "Verify go-api stays healthy under steady traffic with the reduced requests"
  - "Understand that requests drive scheduling and billing, while limits cap usage"

stages:
  - name: inflate
    description: Re-deploy go-api with 10x over-provisioned CPU and memory requests (the 'before' state to observe in OpenCost)
    components:
      # A script (not a bare helm component) because we upgrade the EXISTING
      # go-api Helm release in place — a separate release cannot adopt the
      # go-api namespace/Deployment that `app deploy go-api` already owns.
      - name: go-api-overprovisioned
        type: script
        script: scripts/inflate.sh

checks:
  - name: go-api-running
    type: kubectl
    resource: deployment/go-api
    namespace: go-api
    jsonpath: "{.status.readyReplicas}"
    operator: ">="
    value: "1"

  - name: cpu-request-right-sized
    type: script
    script: scripts/check-cpu-request.sh

  - name: memory-request-right-sized
    type: script
    script: scripts/check-memory-request.sh

  - name: health-check-passes
    type: http
    url: "http://go-api.{{.DomainSuffix}}/health"
    expectStatus: 200

  - name: opencost-running
    type: kubectl
    resource: deployment/opencost
    namespace: opencost
    jsonpath: "{.status.readyReplicas}"
    operator: ">="
    value: "1"

explore:
  urls:
    - label: "OpenCost UI — per-namespace cost breakdown"
      url: "http://localhost:9090 (port-forward first — see commands below)"
    - label: "Grafana — go-api resource usage vs requests"
      url: "http://grafana.{{.DomainSuffix}}"
  commands:
    - label: "0. Open the OpenCost UI (run in background)"
      command: "kubectl -n opencost port-forward svc/opencost 9090 &"
    - label: "1. Confirm the inflated state — checks fail while over-provisioned"
      command: "labctl scenario verify cost-right-sizing"
    - label: "2. Right-size go-api with kubectl set resources"
      command: "kubectl -n go-api set resources deployment go-api --requests=cpu=50m,memory=32Mi --limits=cpu=200m,memory=128Mi"
    - label: "3. Wait for the rollout (a new pod is created with the new requests)"
      command: "kubectl -n go-api rollout status deployment go-api"
    - label: "4. Verify the right-sized state — all checks pass"
      command: "labctl scenario verify cost-right-sizing"
    - label: "5. Observe the cost difference in OpenCost (wait ~1 min for a new data point)"
      command: "kubectl -n opencost port-forward svc/opencost 9090 &"
    - label: "Inspect the current CPU request"
      command: "kubectl -n go-api get deploy go-api -o jsonpath='{.spec.template.spec.containers[0].resources}'"
  tips:
    - "OpenCost uses on-prem pricing defaults in k3d (~$0.048/CPU-hr, ~$0.006/GB-hr). Numbers are relative — useful for comparing before vs after, not real invoices."
    - "Requests drive Kubernetes scheduling and cloud node billing. Limits cap container usage but don't affect node cost. Right-sizing requests is where the savings are."
    - "2000m CPU request = 2 vCPUs reserved per pod even at idle. At ~$0.048/vCPU-hr that's ~$2.30/pod/day before any actual load — for a go-api serving <1 RPS."
    - "The resource checks convert Kubernetes quantity strings (50m, 4000m, 1Gi, 256Mi) to integers before comparing — they use script checks since the quantity format is not a plain float."
    - "After right-sizing, the deployment rolls out a new pod with the new requests — the old over-provisioned pod terminates cleanly."
    - "Tear down with 'labctl scenario down cost-right-sizing'. This is a no-op for the inflate step (it mutated the shared go-api release in place); to restore go-api to default dev requests, re-run 'labctl app deploy go-api' or the 'kubectl set resources' command above."
