# Chaos Engineering Experiments for SnowOps Labs
# These are Chaos Mesh CRD resources that inject failures into the cluster.
# Each experiment targets go-api and a specific failure mode. Apply them
# selectively with a label selector, e.g.:
#   kubectl apply -f chaos-experiments.yaml -l experiment=pod-kill
# (echo-server experiments were removed: echo-server is not a prerequisite of
# this scenario, so its namespace does not exist and applying CRs there fails.)
---
# Experiment 1: Pod Kill — randomly kill go-api pods
# Tests: Self-healing, PDB protection, HPA response
apiVersion: chaos-mesh.org/v1alpha1
kind: PodChaos
metadata:
  name: pod-kill-go-api
  namespace: go-api
  labels:
    app.kubernetes.io/part-of: chaos-engineering
    experiment: pod-kill
spec:
  action: pod-kill
  mode: one
  selector:
    namespaces:
      - go-api
    labelSelectors:
      app: go-api
  duration: "30s"
---
# Experiment 2: Pod Failure — make go-api pods unavailable for 60s
# Tests: Readiness probe behavior, traffic routing during failures
apiVersion: chaos-mesh.org/v1alpha1
kind: PodChaos
metadata:
  name: pod-failure-go-api
  namespace: go-api
  labels:
    app.kubernetes.io/part-of: chaos-engineering
    experiment: pod-failure
spec:
  action: pod-failure
  mode: one
  selector:
    namespaces:
      - go-api
    labelSelectors:
      app: go-api
  duration: "60s"
---
# Experiment 3: Network Partition — isolate go-api from ingress traffic
# Tests: Circuit breaker behavior, failover mechanisms
apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: network-partition-go-api
  namespace: go-api
  labels:
    app.kubernetes.io/part-of: chaos-engineering
    experiment: network-partition
spec:
  action: partition
  mode: all
  selector:
    namespaces:
      - go-api
    labelSelectors:
      app: go-api
  direction: both
  target:
    mode: all
    selector:
      namespaces:
        - traefik
  duration: "60s"
---
# Experiment 4: CPU Stress — saturate CPU on go-api pods
# Tests: HPA scale-up reaction, resource limit behavior, OOM avoidance
apiVersion: chaos-mesh.org/v1alpha1
kind: StressChaos
metadata:
  name: cpu-stress-go-api
  namespace: go-api
  labels:
    app.kubernetes.io/part-of: chaos-engineering
    experiment: cpu-stress
spec:
  mode: one
  selector:
    namespaces:
      - go-api
    labelSelectors:
      app: go-api
  stressors:
    cpu:
      workers: 2
      load: 80
  duration: "120s"
