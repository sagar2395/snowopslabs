---
# Dev environment — namespace, release metadata, go-api deployment + service
apiVersion: v1
kind: Namespace
metadata:
  name: env-dev
  labels:
    snowops.net/env: dev
    snowops.net/scenario: env-promotion
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: env-metadata
  namespace: env-dev
  labels:
    snowops.net/env: dev
    snowops.net/scenario: env-promotion
data:
  env_name: "dev"
  app: "go-api"
  image_tag: "v1.2.0"
  promoted_from: ""
  promoted_at: ""
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-api
  namespace: env-dev
  labels:
    app: go-api
    snowops.net/env: dev
    snowops.net/image-tag: v1.2.0
spec:
  replicas: 1
  selector:
    matchLabels:
      app: go-api
      snowops.net/env: dev
  template:
    metadata:
      labels:
        app: go-api
        snowops.net/env: dev
    spec:
      containers:
        - name: go-api
          image: go-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: ENV_NAME
              value: dev
            - name: IMAGE_TAG
              valueFrom:
                configMapKeyRef:
                  name: env-metadata
                  key: image_tag
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: go-api
  namespace: env-dev
  labels:
    snowops.net/env: dev
spec:
  selector:
    app: go-api
    snowops.net/env: dev
  ports:
    - port: 80
      targetPort: 8080
---
# Per-environment ingress so each env's go-api is reachable at its own URL:
#   http://go-api-dev.<DOMAIN_SUFFIX>   (add hosts with `labctl hosts add`)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: go-api
  namespace: env-dev
  labels:
    snowops.net/env: dev
    snowops.net/scenario: env-promotion
spec:
  ingressClassName: {{.IngressClass}}
  rules:
    - host: go-api-dev.{{.DomainSuffix}}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: go-api
                port:
                  number: 80
