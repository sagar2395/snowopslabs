apiVersion: scenario.snowops.net/v2
name: env-promotion
verified: true
displayName: "Multi-Env Promotion (Dev → Staging → Prod)"
description: "Run a real release pipeline by hand: build versioned {{.WorkloadName}} images, deploy one to dev, and promote it forward to staging then prod with plain kubectl. Promotion here is a genuine image rollout (new ReplicaSet), not a ConfigMap edit — you build vNEXT, roll it out per environment, and watch each env's /version change as the release moves down the pipeline."
category: delivery
prerequisites:
  platform:
    - ingress
    - monitoring/metrics
  apps:
    - "{{.WorkloadName}}"
runtimes:
  - k3d
  - kind

objectives:
  - "Understand environment separation as Kubernetes namespace isolation (env-dev / env-staging / env-prod)"
  - "Build multiple immutable, versioned images ({{.WorkloadName}}:v1.0.0, v1.1.0, …) and load them into the cluster"
  - "Deploy a new version to dev only, and prove the other environments are unchanged"
  - "Promote a version dev → staging → prod with 'kubectl set image' + 'kubectl rollout status' — a real rollout"
  - "Roll back a bad promotion with 'kubectl rollout undo'"
  - "Verify the pipeline: every environment's running image matches its declared tag"

stages:
  - name: seed-baseline
    description: Build the {{.WorkloadName}}:v1.0.0 baseline image and load it into the cluster
    components:
      - name: baseline-image
        type: script
        script: scripts/seed-baseline-image.sh
        uninstallScript: scripts/unseed-baseline-image.sh

  - name: dev-env
    description: Deploy {{.WorkloadName}}:v1.0.0 into the dev environment (namespace env-dev)
    components:
      - name: dev-environment
        type: manifest
        path: manifests/dev-env.yaml

  - name: staging-env
    description: Deploy {{.WorkloadName}}:v1.0.0 into the staging environment (namespace env-staging)
    components:
      - name: staging-environment
        type: manifest
        path: manifests/staging-env.yaml

  - name: prod-env
    description: Deploy {{.WorkloadName}}:v1.0.0 into the prod environment (namespace env-prod)
    components:
      - name: prod-environment
        type: manifest
        path: manifests/prod-env.yaml

      - name: promotion-dashboard
        type: grafana-dashboard
        path: dashboards/
        namespace: "{{.MonitoringNamespace}}"

checks:
  - name: env-dev-namespace-exists
    type: kubectl
    resource: namespace/env-dev
    remediation: "The dev environment is missing. Re-activate the scenario to rebuild the three environments: labctl scenario up env-promotion --force"

  - name: env-staging-namespace-exists
    type: kubectl
    resource: namespace/env-staging
    remediation: "The staging environment is missing. Re-activate the scenario: labctl scenario up env-promotion --force"

  - name: env-prod-namespace-exists
    type: kubectl
    resource: namespace/env-prod
    remediation: "The prod environment is missing. Re-activate the scenario: labctl scenario up env-promotion --force"

  - name: workload-running-in-dev
    type: kubectl
    resource: deployment/{{.WorkloadName}}
    namespace: env-dev
    jsonpath: "{.status.readyReplicas}"
    operator: ">="
    value: "1"
    remediation: "Nothing is Ready in env-dev yet. Straight after activation the rollout is usually still in flight — re-run with 'labctl scenario verify env-promotion --watch'. If it stays down, look at the pods: a promotion to a tag that was never built leaves them in ImagePullBackOff. kubectl -n env-dev get pods"

  - name: workload-running-in-staging
    type: kubectl
    resource: deployment/{{.WorkloadName}}
    namespace: env-staging
    jsonpath: "{.status.readyReplicas}"
    operator: ">="
    value: "1"
    remediation: "Nothing is Ready in env-staging yet. Straight after activation the rollout is usually still in flight — re-run with 'labctl scenario verify env-promotion --watch'. If it stays down: kubectl -n env-staging get pods && kubectl -n env-staging rollout status deploy/{{.WorkloadName}}"

  - name: workload-running-in-prod
    type: kubectl
    resource: deployment/{{.WorkloadName}}
    namespace: env-prod
    jsonpath: "{.status.readyReplicas}"
    operator: ">="
    value: "1"
    remediation: "Nothing is Ready in env-prod yet. Straight after activation the rollout is usually still in flight — re-run with 'labctl scenario verify env-promotion --watch'. If it stays down: kubectl -n env-prod get pods && kubectl -n env-prod rollout status deploy/{{.WorkloadName}}"

  - name: declared-tag-matches-running-image
    type: script
    script: scripts/check-images-consistent.sh
    remediation: "Every env's release record must match live state at three levels: the Deployment's full image ref, a converged rollout (observedGeneration == generation, updatedReplicas == readyReplicas == replicas), and the image the kubelet reports each pod is running. Re-run the failing env's 'kubectl set image' + 'kubectl rollout status', then patch env-metadata's declared_tag to the same tag."

  - name: newer-release-reached-prod
    type: kubectl
    resource: configmap/env-metadata
    namespace: env-prod
    jsonpath: "{.data.declared_tag}"
    operator: "!="
    value: "v1.0.0"
    pending: true
    remediation: "Build a newer image and promote it through to prod: bash scenarios/env-promotion/scripts/build-image.sh v1.1.0 && kubectl -n env-dev set image deployment/{{.WorkloadName}} {{.WorkloadName}}={{.WorkloadName}}:v1.1.0 && kubectl -n env-dev rollout status deployment/{{.WorkloadName}} (then repeat for env-staging and env-prod, updating each env-metadata declared_tag to v1.1.0)."

  # Objective 5 was previously only a suggestion in explore. It is graded here on
  # the one thing a rollback leaves behind that rolling forward cannot: prod
  # serving a ReplicaSet older than the newest it has created.
  - name: rollback-was-exercised
    type: script
    script: checks/rollback-was-exercised.sh
    pending: true
    remediation: "You have promoted forward but never had to come back. Ship a release to prod that cannot land — kubectl -n env-prod set image deployment/{{.WorkloadName}} {{.WorkloadName}}={{.WorkloadName}}:v9.9.9 — verify to see the drift reported, then recover with kubectl -n env-prod rollout undo deployment/{{.WorkloadName}} and put declared_tag back to the release you returned to."

references:
  - label: "Kubernetes — Deployments: updating, rollout status and rolling back"
    url: "https://kubernetes.io/docs/concepts/workloads/controllers/deployment/#updating-a-deployment"
    note: "Why 'set image' creates a new ReplicaSet, and why 'rollout undo' re-activates an old one instead of building anything."
  - label: "Kubernetes — Object management: spec vs status"
    url: "https://kubernetes.io/docs/concepts/overview/working-with-objects/#object-spec-and-status"
    note: "The distinction the consistency check is built on: your intent, and what the controller has actually achieved."
  - label: "Kubernetes — Images and imagePullPolicy"
    url: "https://kubernetes.io/docs/concepts/containers/images/"
    note: "Why an environment must pin an explicit tag, and what happens when it names one that was never built."
  - label: "OCI — Image tags are mutable, digests are not"
    url: "https://github.com/opencontainers/distribution-spec/blob/main/spec.md#pulling-manifests"
    note: "The reason 'promote the artifact you tested' means promoting one immutable build rather than rebuilding per environment."

snippets:
  - label: "One environment's full stack (namespace, deployment, service, ingress)"
    description: "Each env is the same shape in its own namespace, pinned to an EXPLICIT image tag ({{.WorkloadName}}:v1.0.0) — never :latest. Promotion changes spec.template.spec.containers[].image, which rolls out a new ReplicaSet. Read this to see there is no magic: promotion is a plain image change on a Deployment."
    path: manifests/dev-env.yaml
  - label: "build-image.sh — how a new version enters the cluster"
    description: "Build {{.WorkloadName}} at an explicit tag and load it into k3d/kind. This is the 'docker build + push' of a real pipeline, minus a registry. The tag is baked into the binary, so /version reports exactly what you built."
    path: scripts/build-image.sh
  - label: "check-images-consistent.sh — what 'verify' actually grades"
    description: "The invariant that declared_tag == live state for every env. It compares the FULL image ref (not just the tag), then proves the rollout converged (spec vs status, generation vs observedGeneration), then checks what the kubelet reports each pod is actually running. Read it to see why editing a ConfigMap — or starting a rollout that never finishes — does NOT count as a promotion."
    path: scripts/check-images-consistent.sh

explore:
  urls:
    - label: "Grafana — the pipeline: which tag each env asked for, and whether it landed"
      url: "http://grafana.{{.DomainSuffix}}/d/env-promotion"
    - label: "{{.WorkloadName}} /version — dev environment"
      url: "http://{{.WorkloadName}}-dev.{{.DomainSuffix}}/version"
    - label: "{{.WorkloadName}} /version — staging environment"
      url: "http://{{.WorkloadName}}-staging.{{.DomainSuffix}}/version"
    - label: "{{.WorkloadName}} /version — prod environment"
      url: "http://{{.WorkloadName}}-prod.{{.DomainSuffix}}/version"
  commands:
    - label: "0. Add env hostnames to /etc/hosts (once, needs sudo)"
      command: "sudo labctl hosts add"
    - label: "1. Baseline check — all three envs serve the SAME version (v1.0.0)"
      command: "for e in dev staging prod; do echo -n \"$e: \"; curl -s {{.WorkloadName}}-$e.{{.DomainSuffix}}/version; echo; done"
    - label: "2. Make a code change you can SEE: make a visible change in the workload's source under apps/{{.WorkloadName}}/ (go-api exposes `releaseNote` in main.go)"
      command: "grep -rn 'releaseNote' apps/{{.WorkloadName}}/ 2>/dev/null || echo 'this workload has no releaseNote — change any user-visible string, then rebuild'"
    - label: "3. Build the new version and load it into the cluster (this is 'docker build + push')"
      command: "bash scenarios/env-promotion/scripts/build-image.sh v1.1.0"
    - label: "4. Deploy to DEV ONLY — a real rollout (new ReplicaSet), then record the declared tag"
      command: "kubectl -n env-dev set image deployment/{{.WorkloadName}} {{.WorkloadName}}={{.WorkloadName}}:v1.1.0 && kubectl -n env-dev rollout status deployment/{{.WorkloadName}} && kubectl -n env-dev patch cm env-metadata --type=merge -p '{\"data\":{\"declared_tag\":\"v1.1.0\"}}'"
    - label: "5. Prove dev changed and staging/prod did NOT — this is what the promote command actually moves"
      command: "for e in dev staging prod; do echo -n \"$e: \"; curl -s {{.WorkloadName}}-$e.{{.DomainSuffix}}/version; echo; done"
    - label: "6. Promote dev → STAGING (same image, forward one environment)"
      command: "kubectl -n env-staging set image deployment/{{.WorkloadName}} {{.WorkloadName}}={{.WorkloadName}}:v1.1.0 && kubectl -n env-staging rollout status deployment/{{.WorkloadName}} && kubectl -n env-staging patch cm env-metadata --type=merge -p '{\"data\":{\"declared_tag\":\"v1.1.0\",\"promoted_from\":\"dev\"}}'"
    - label: "7. Promote staging → PROD (release to production)"
      command: "kubectl -n env-prod set image deployment/{{.WorkloadName}} {{.WorkloadName}}={{.WorkloadName}}:v1.1.0 && kubectl -n env-prod rollout status deployment/{{.WorkloadName}} && kubectl -n env-prod patch cm env-metadata --type=merge -p '{\"data\":{\"declared_tag\":\"v1.1.0\",\"promoted_from\":\"staging\"}}'"
    - label: "8. Verify the pipeline so far (declared == running everywhere; a newer release reached prod)"
      command: "labctl scenario verify env-promotion"
    - label: "9. ROLLBACK DRILL — ship prod something that cannot land (a tag nobody ever built)"
      command: "kubectl -n env-prod set image deployment/{{.WorkloadName}} {{.WorkloadName}}={{.WorkloadName}}:v9.9.9"
    - label: "10. Watch it fail to arrive — the spec says v9.9.9, the pods do not, and verify says so"
      command: "kubectl -n env-prod get pods && labctl scenario verify env-promotion"
    - label: "11. Recover — undo is the fastest lever you have, because it reuses a ReplicaSet"
      command: "kubectl -n env-prod rollout undo deployment/{{.WorkloadName}} && kubectl -n env-prod rollout status deployment/{{.WorkloadName}} && kubectl -n env-prod rollout history deployment/{{.WorkloadName}}"
    - label: "12. Put the release record back in step with reality, then grade the whole drill"
      command: "kubectl -n env-prod patch cm env-metadata --type=merge -p '{\"data\":{\"declared_tag\":\"v1.1.0\"}}' && labctl scenario verify env-promotion"
    - label: "Watch a rollout happen live (run in a second terminal before promoting)"
      command: "kubectl -n env-staging get pods -w"
    - label: "Diff what's running between two environments"
      command: "diff <(kubectl -n env-dev get deploy {{.WorkloadName}} -o jsonpath='{.spec.template.spec.containers[0].image}') <(kubectl -n env-prod get deploy {{.WorkloadName}} -o jsonpath='{.spec.template.spec.containers[0].image}') && echo 'same image' || echo 'environments differ'"
  tips:
    - "Default mode: one cluster, three namespaces (env-dev/staging/prod). Laptop-friendly — no extra clusters."
    - "Activation returns as soon as the manifests are applied, so a verify run in the same breath will report the three environments as not Ready. That is the rollout still happening, not a broken lab — use 'labctl scenario verify env-promotion --watch'."
    - "Promotion moves an IMAGE, not a config value. 'kubectl set image' changes spec.template, which creates a new ReplicaSet — that rollout IS the promotion. Editing env-metadata alone would fail 'labctl scenario verify'."
    - "Versions are immutable: build {{.WorkloadName}}:v1.1.0 once, then promote that SAME image dev→staging→prod. You never rebuild per environment — that is the point of promoting a tested artifact forward."
    - "The version is baked into the image (main.version). Change something user-visible in the workload's source before building (go-api has `releaseNote` in main.go) so you can SEE the new build in /version as it moves through the pipeline."
    - "'labctl scenario verify' grades the real outcome: declared_tag must equal the running image in every env, and a newer-than-baseline release must have reached prod."
    - "spec vs status is the core Kubernetes lesson here. 'kubectl set image' only writes .spec — your intent. The Deployment controller writes .status once reality catches up. Compare them yourself: kubectl -n env-prod get deploy {{.WorkloadName}} -o jsonpath='{.metadata.generation} {.status.observedGeneration} {.status.updatedReplicas}/{.spec.replicas}'"
    - "Drift detection is the real-world skill: a release record that claims v1.1.0 while the cluster serves v1.0.0 is exactly what ArgoCD reports as OutOfSync. Steps 9-12 make you cause it deliberately — spec says v9.9.9, the rollout never converges, pods still run the old tag, and the check tells you all three."
    - "A rollback is graded on what it leaves behind. Rolling FORWARD always creates a new ReplicaSet; coming back re-activates an older one and bumps its revision. So 'prod is serving a ReplicaSet that is not the newest it has created' means prod went somewhere and returned — and it is true whether you used 'rollout undo' or set the image back by hand, because those are the same operation."
    - "Watch the ReplicaSet count on the dashboard across steps 9-12: it goes up when you ship v9.9.9 and does NOT go up when you undo. That is the whole reason a rollback is seconds and a rebuild is minutes — nothing is being built."
    - "Deleting the workload namespaces is not how you finish. 'labctl scenario down env-promotion' removes the three environments and the versioned images it built; the ':latest' tag every other scenario runs on is deliberately left alone."
    - "Break it on purpose: patch env-metadata's declared_tag WITHOUT running 'kubectl set image', then verify — the consistency check catches the drift. That is why the ConfigMap alone is not a promotion."
    - "This scenario teaches IMPERATIVE promotion — you run the rollout yourself with kubectl. For the DECLARATIVE version, where you commit an image tag to Git and ArgoCD reconciles it (with automated prune + self-heal), run the 'gitops-cicd' scenario. Same goal, two philosophies."
    - "Tear down with 'labctl scenario down env-promotion' — removes all three namespaces cleanly."
