name: service-selector-broken
verified: true
displayName: "Service selector mismatch: empty endpoints"
description: "{{.WorkloadName}} returns 503s through the ingress, but every pod is Running and Ready and nothing was deployed. The Service exists. The pods exist. They just don't know about each other anymore."
category: config
severity: medium
target:
  namespace: "{{.WorkloadNamespace}}"
  workload: "{{.WorkloadName}}"
prerequisites:
  platform:
    - ingress
  apps:
    - "{{.WorkloadName}}"
detection:
  name: service-reachable
  type: http
  url: "http://{{.WorkloadName}}.{{.DomainSuffix}}/health"
  expectStatus: 200
  timeoutSeconds: 15
