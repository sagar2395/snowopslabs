apiVersion: v1
kind: Namespace
metadata:
  name: ${TARGET_NAMESPACE}
  labels:
    labfault: noisy-neighbor
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${TARGET_WORKLOAD}
  namespace: ${TARGET_NAMESPACE}
  labels:
    labfault: noisy-neighbor
spec:
  replicas: ${BURNER_REPLICAS}
  selector:
    matchLabels:
      app: ${TARGET_WORKLOAD}
  template:
    metadata:
      labels:
        app: ${TARGET_WORKLOAD}
    spec:
      # Pinned to the node the victim is already on. Contention is a property of
      # a SHARED node, and left to the scheduler these pods land wherever there
      # is room — on a three-node lab, usually not the node that matters. The
      # fault would inject cleanly and nothing would happen.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values: ["${BURNER_NODE}"]
      containers:
        - name: burner
          image: busybox:1.36
          # One hot loop per replica, and the loop is single-threaded, so each
          # replica takes exactly one core. The request reserves scheduler
          # capacity and buys a large CFS share; the missing limit is what lets
          # it take everything the node has left.
          command: ["sh", "-c", "while true; do :; done"]
          resources:
            requests:
              cpu: 500m
              memory: 16Mi
