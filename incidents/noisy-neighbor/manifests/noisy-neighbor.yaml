apiVersion: v1
kind: Namespace
metadata:
  name: labfault-noisy-neighbor
  labels:
    labfault: noisy-neighbor
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: noisy-neighbor
  namespace: labfault-noisy-neighbor
  labels:
    labfault: noisy-neighbor
spec:
  replicas: 2
  selector:
    matchLabels:
      app: noisy-neighbor
  template:
    metadata:
      labels:
        app: noisy-neighbor
    spec:
      containers:
        - name: burner
          image: busybox:1.36
          # A hot loop per replica; requests reserve scheduler capacity,
          # and the missing CPU limit lets it eat whatever is left.
          command: ["sh", "-c", "while true; do :; done"]
          resources:
            requests:
              cpu: 500m
              memory: 16Mi
