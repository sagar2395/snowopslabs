name: crashloop-bad-config
verified: true
displayName: "CrashLoop: broken container command"
description: "Users report the latest {{.WorkloadName}} deploy never finished. New pods start, die instantly, and start again — classic CrashLoopBackOff. The old pods are still serving, so traffic mostly works… for now."
category: workload
severity: medium
target:
  namespace: "{{.WorkloadNamespace}}"
  workload: "{{.WorkloadName}}"
prerequisites:
  apps:
    - "{{.WorkloadName}}"
detection:
  name: rollout-healthy
  type: script
  script: checks/resolved.sh
  timeoutSeconds: 30
expectAlert: LabFaultCrashLoop
