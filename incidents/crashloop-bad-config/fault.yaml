name: crashloop-bad-config
displayName: "CrashLoop: broken container command"
description: "Users report the latest go-api deploy never finished. New pods start, die instantly, and start again — classic CrashLoopBackOff. The old pods are still serving, so traffic mostly works… for now."
category: workload
severity: medium
target:
  namespace: go-api
  workload: go-api
prerequisites:
  apps:
    - go-api
detection:
  name: rollout-healthy
  type: script
  script: checks/resolved.sh
  timeoutSeconds: 30
expectAlert: LabFaultCrashLoop
