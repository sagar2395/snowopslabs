name: oom-kill
displayName: "OOMKilled: memory limit too low"
description: "{{.WorkloadName}} pods keep restarting and the service is flapping. Restart counts climb; the kernel is killing the container the moment it allocates memory."
category: resources
severity: high
target:
  namespace: "{{.WorkloadNamespace}}"
  workload: "{{.WorkloadName}}"
prerequisites:
  apps:
    - "{{.WorkloadName}}"
detection:
  name: rollout-healthy
  type: script
  script: checks/resolved.sh
  timeoutSeconds: 30
expectAlert: LabFaultOOMKill

references:
  - label: "Kubernetes — Assign memory resources to containers"
    url: "https://kubernetes.io/docs/tasks/configure-pod-container/assign-memory-resource/"
    note: "requests vs limits, and what the kernel does when a container exceeds its memory limit."
  - label: "Kubernetes — Debug an OOMKilled container / exit code 137"
    url: "https://kubernetes.io/docs/tasks/debug/debug-application/debug-running-pod/"
  - label: "Prometheus — kube-state-metrics container restart & OOM signals"
    url: "https://github.com/kubernetes/kube-state-metrics/blob/main/docs/metrics/workload/pod-metrics.md"

snippets:
  - label: "Raise {{.WorkloadName}}'s memory limit (strategic-merge patch)"
    description: "Bumps the limit above the working set so the kernel stops killing it. Apply with: kubectl -n {{.WorkloadNamespace}} patch deployment {{.WorkloadName}} --patch-file <this>"
    yaml: |
      spec:
        template:
          spec:
            containers:
              - name: "{{.WorkloadName}}"
                resources:
                  requests:
                    memory: "32Mi"
                  limits:
                    memory: "128Mi"
  - label: "Watch the restart count settle after the fix"
    yaml: |
      # kubectl -n {{.WorkloadNamespace}} get pods -w \
      #   -o custom-columns=NAME:.metadata.name,RESTARTS:.status.containerStatuses[0].restartCount,STATE:.status.phase
