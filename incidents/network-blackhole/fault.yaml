name: network-blackhole
verified: true
displayName: "Network blackhole: service unreachable"
description: "{{.WorkloadName}} went dark. Every request through the ingress times out or 5xxes — yet the pods are Running and Ready, logs are quiet, and nothing was deployed. Something is eating the traffic."
category: network
severity: high
target:
  namespace: "{{.WorkloadNamespace}}"
  workload: "{{.WorkloadName}}"
prerequisites:
  platform:
    - ingress
  apps:
    - "{{.WorkloadName}}"
detection:
  name: service-reachable
  type: http
  url: "http://{{.WorkloadName}}.{{.DomainSuffix}}/health"
  expectStatus: 200
  timeoutSeconds: 15
