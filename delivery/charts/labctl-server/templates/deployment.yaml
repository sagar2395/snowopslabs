apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "labctl-server.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "labctl-server.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "labctl-server.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "labctl-server.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "labctl-server.serviceAccountName" . }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: labctl-server
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["ui", "--port", "{{ .Values.service.port }}", "--project-dir", "/app"]
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
          env:
            - name: PROFILE
              value: incluster
            - name: LABCTL_AUTH
              value: {{ .Values.auth.enabled | quote }}
            {{- if .Values.auth.enabled }}
            - name: LABCTL_USERS_FILE
              value: /etc/labctl/users.yaml
            {{- end }}
            {{- range $k, $v := .Values.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /api/auth/me
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/auth/me
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            {{- if .Values.persistence.enabled }}
            - name: data
              mountPath: /app/.labctl
            {{- end }}
            {{- if .Values.auth.enabled }}
            - name: users
              mountPath: /etc/labctl
              readOnly: true
            {{- end }}
      volumes:
        {{- if .Values.persistence.enabled }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "labctl-server.fullname" . }}-data
        {{- end }}
        {{- if .Values.auth.enabled }}
        - name: users
          secret:
            secretName: {{ include "labctl-server.usersSecretName" . }}
            optional: true
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
